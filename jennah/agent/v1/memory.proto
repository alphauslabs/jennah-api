syntax = "proto3";

package jennahapi.agent.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/alphauslabs/jennah-api/agent";

// MemoryService is the unified memory-data plane for an agent workspace.
service MemoryService {
  // Applies a multi-section memory step in a SINGLE read-write transaction: an
  // optional execution-log step, an optional set of vector chunks, an optional
  // set of graph writes, and an optional set of supersessions. The commit is
  // all-or-nothing: if any section fails (e.g. a vector whose width does not
  // match the database, or a supersession naming a prior id that is not there),
  // no section's rows are written. The commit is rejected, writing nothing, if
  // the target workspace does not exist under the caller's tenant. Returns a
  // receipt: the commit timestamp and per-memory-type row counts.
  rpc CommitMemory(CommitMemoryRequest) returns (CommitMemoryResponse) {
    option (google.api.http) = {
      post: "/v1/agents/{scope_id}/memory:commit"
      body: "*"
      additional_bindings: {
        post: "/v1/scopes/{scope_id}/memory:commit"
        body: "*"
      }
    };
  }

  // Evaluates a multi-section read against ONE read snapshot so results are
  // internally consistent across memory types: an optional semantic (vector)
  // section, an optional graph (traversal) section, and an optional execution-log
  // section. Returns one result section per requested section, plus a fused
  // result when `link` is set. An optional `as_of` timestamp is applied
  // uniformly to every section so all sections observe the same historical
  // instant. Every section is clamped to the caller's (EnterpriseId,
  // AgentInstanceId) slice.
  rpc QueryMemory(QueryMemoryRequest) returns (QueryMemoryResponse) {
    option (google.api.http) = {
      post: "/v1/agents/{scope_id}/memory:query"
      body: "*"
      additional_bindings: {
        post: "/v1/scopes/{scope_id}/memory:query"
        body: "*"
      }
    };
  }

  // Lists the stored rows of one or more memory sections WITHOUT a query anchor,
  // for debugging and inspection: the vector chunks (content only; embedding
  // vectors are never returned), the graph nodes and edges, and the recent
  // execution-log steps. Unlike QueryMemory it takes no semantic query or graph
  // start pattern; each requested section is simply enumerated within the
  // caller's (EnterpriseId, AgentInstanceId) slice, up to a per-section limit,
  // at ONE read snapshot so every section observes the same instant. This is a
  // read-only diagnostic surface, not a retrieval path.
  rpc InspectMemory(InspectMemoryRequest) returns (InspectMemoryResponse) {
    option (google.api.http) = {
      post: "/v1/agents/{scope_id}/memory:inspect"
      body: "*"
      additional_bindings: {
        post: "/v1/scopes/{scope_id}/memory:inspect"
        body: "*"
      }
    };
  }

  // Replaces a currently-held graph fact WITHOUT destroying it (add-temporal-
  // graph). In one read-write transaction it closes the prior edge's valid-time
  // window (its invalid_at becomes the new edge's valid_at, its transaction-time
  // start preserved) and inserts the replacement edge in the same
  // (EnterpriseId, AgentInstanceId) slice with a fresh transaction-time start and
  // an open window (unless new_edge.invalid_at is set). The prior edge stays
  // queryable as history via an as_of graph query. Supersession is caller-driven:
  // the platform never infers which facts conflict. new_edge.valid_at (the
  // supersession boundary) is REQUIRED and new_edge.edge_id must differ from
  // prior_edge_id; an unknown prior edge is NotFound and a reused new edge_id is
  // AlreadyExists. This is the graph.supersede surface in the SDK.
  //
  // This is the SINGLE-ITEM FORM of CommitMemoryRequest's `supersessions` section,
  // not a separate mechanism: it constructs that commit and reaches the store the
  // same way, so the two are observably identical apart from the URL. Use the
  // section when a supersession must land in the same transaction as other writes;
  // use this when retiring one fact is the whole operation. Neither is deprecated.
  rpc SupersedeEdge(SupersedeEdgeRequest) returns (SupersedeEdgeResponse) {
    option (google.api.http) = {
      post: "/v1/agents/{scope_id}/graph/edges:supersede"
      body: "*"
      additional_bindings: {
        post: "/v1/scopes/{scope_id}/graph/edges:supersede"
        body: "*"
      }
    };
  }

  // Replaces a currently-held semantic passage WITHOUT destroying it
  // (add-temporal-vectors). The vector counterpart of SupersedeEdge, with the same
  // semantics on the same terms: in one read-write transaction it closes the prior
  // chunk's valid-time window (its invalid_at becomes the new chunk's valid_at, its
  // transaction-time start preserved) and inserts the replacement chunk in the same
  // (EnterpriseId, AgentInstanceId) slice with a fresh transaction-time start and an
  // open window. The prior chunk keeps its content and stays readable as history via
  // an as_of_valid semantic query. Supersession is caller-driven: the platform never
  // infers which passages conflict, and performs no model-driven detection of it.
  // new_chunk.valid_at (the supersession boundary) is REQUIRED and new_chunk.chunk_id
  // must differ from prior_chunk_id; an unknown prior chunk is NotFound and a reused
  // new chunk_id is AlreadyExists.
  //
  // The superseded chunk stops being returned by ordinary semantic search from this
  // point on, which is the operation's purpose: a retired passage that stayed
  // rankable would go on occupying the limited slots a caller injects into a prompt.
  //
  // This is the SINGLE-ITEM FORM of CommitMemoryRequest's `supersessions` section,
  // on the same terms as SupersedeEdge above. One difference is visible to callers
  // and it is a difference of SHAPE, not of behavior: this request has no
  // reject_on_truncation field, so a replacement whose generated embedding the
  // model truncates is REPORTED here (in `truncated`) and never refused. That is
  // this operation's long-standing contract (refusing would leave a caller with a
  // fact they have decided is stale and no way to retire it), and it is preserved
  // by constructing a commit with that flag unset.
  rpc SupersedeChunk(SupersedeChunkRequest) returns (SupersedeChunkResponse) {
    option (google.api.http) = {
      post: "/v1/agents/{scope_id}/vectors/chunks:supersede"
      body: "*"
      additional_bindings: {
        post: "/v1/scopes/{scope_id}/vectors/chunks:supersede"
        body: "*"
      }
    };
  }

  // Forms memory FROM RAW CONVERSATION, deciding what is worth remembering
  // instead of being told (add-memory-cognition). It takes the turns an agent
  // exchanged, extracts candidate facts and relationships from them with a
  // language model, retrieves what the scope already holds near each candidate,
  // decides per candidate whether it is new, a revision of something held, or
  // already known, and applies the result as ONE CommitMemory in one
  // transaction. It returns a receipt naming every candidate and its decision.
  //
  // This is the "work out what to store" surface; CommitMemory is the "store
  // this" one. It is ADDITIVE: a caller that authors its own writes keeps using
  // CommitMemory unchanged and pays none of this operation's cost.
  //
  // THREE THINGS A CALLER MUST KNOW BEFORE USING IT.
  //
  // It is a DIFFERENT LATENCY CLASS. Two model round-trips plus a retrieval plus
  // a commit means seconds, not the milliseconds CommitMemory takes. Do not put
  // it on a request path that expects a commit's latency.
  //
  // It will frequently STORE NOTHING, and that is success. A conversation
  // holding nothing worth remembering forms no memory and returns a receipt with
  // zero candidates; a conversation restating what the scope already holds forms
  // no memory and returns a receipt of `known` decisions. Neither is an error,
  // and the receipt is what distinguishes them from each other and from a
  // refusal.
  //
  // Submitted turns are SENT TO AN EXTERNAL INFERENCE SERVICE (Vertex AI) in the
  // scope's own region, exactly as the caller wrote them. The platform does not
  // scan, filter, or redact formation input. A region with no generative model
  // configured REFUSES formation with FAILED_PRECONDITION rather than inferring
  // in another region, because a region-pinned scope whose content is inferred
  // elsewhere breaks a residency commitment invisibly.
  //
  // Formation NEVER DELETES and never overwrites: a revision closes the prior
  // assertion's valid-time window and inserts a replacement, exactly as
  // SupersedeEdge and SupersedeChunk do, so what the agent believed before the
  // formation stays readable by an as-of query.
  //
  // Retry it with `formation_key`. Extraction is nondeterministic, so a blind
  // resend would form a SECOND, DIFFERENT set of memory; a resend under the same
  // key returns the first call's receipt without re-extracting.
  rpc FormMemory(FormMemoryRequest) returns (FormMemoryResponse) {
    option (google.api.http) = {
      post: "/v1/agents/{scope_id}/memory:form"
      body: "*"
    };
  }
}

// ---------------------------------------------------------------------------
// Commit
// ---------------------------------------------------------------------------

// Request for MemoryService.CommitMemory.
//
// Any subset of the three section fields may be present; at least one SHOULD
// be. All present sections are written in the same transaction.
message CommitMemoryRequest {
  // DEPRECATED, superseded by `scope_id`, which names the same value for a
  // scope of either kind. Read only when `scope_id` is empty, so existing gRPC
  // callers keep working unchanged; both HTTP routes bind `scope_id`, so a REST
  // caller never populates this one. Setting both to DIFFERENT values is
  // INVALID_ARGUMENT rather than resolved by precedence, because a request that
  // names two scopes has not said which one it means.
  string agent_instance_id = 1 [deprecated = true];

  // Execution-log section: a single step the agent recorded. Absent to commit
  // no log step.
  ExecutionLogStep log = 2;

  // Vector section: chunks to upsert (write-or-replace) within the agent slice.
  // Empty to commit no vectors.
  repeated VectorChunk vectors = 3;

  // Graph section: node and/or edge writes. Absent to commit no graph data.
  GraphWrite graph = 4;

  // When set, embedding truncation is FATAL to the whole commit instead of
  // merely reported: if the model truncates any chunk whose vector the server
  // generated, the commit is rejected and no section's rows are written.
  bool reject_on_truncation = 5;

  // Optional target memory scope, defaulting to the scope named by the route.
  // Every section of the commit is applied to this ONE scope in one transaction.
  //
  // A commit never writes more than one scope, and that holds even when two
  // scopes happen to share a data-plane database. A commit spanning scopes is
  // impossible across regions, so permitting it for co-resident scopes alone
  // would make the atomicity a caller can rely on depend on deployment topology
  // rather than on the contract. Naming a second scope is INVALID_ARGUMENT.
  string target_scope = 6;

  // Route path parameter, never read from the body: the memory scope this commit
  // addresses, of EITHER kind. Bound by both `/v1/agents/{scope_id}/...` and
  // `/v1/scopes/{scope_id}/...`, which are one operation reached two ways: the
  // agent form is the agent-kind view and the scope form is the general one.
  //
  // It replaces `agent_instance_id`, which named the same value back when a
  // workspace was the only kind of scope there was.
  string scope_id = 7;

  // Supersession section: facts to RETIRE while preserving them, each paired with
  // the replacement that takes over. Absent to commit no supersessions.
  //
  // This is the same operation MemoryService.SupersedeEdge and SupersedeChunk
  // perform, reached as a section so it composes ATOMICALLY with the other
  // sections: retiring a fact and recording everything that follows from it is one
  // transaction, at one commit timestamp, under the same all-or-nothing rule. The
  // standalone RPCs remain available and are the single-item form of exactly this;
  // neither is deprecated, and both construct a commit carrying this section.
  //
  // The section's write discipline DIFFERS from `vectors` and `graph`, and the
  // difference is the point. Those sections UPSERT: re-writing an id replaces that
  // row's content, which is how a caller CORRECTS an item. A supersession INSERTS
  // its replacement and leaves the prior row's content intact, which is how a
  // caller records that the fact an item asserted has CHANGED. Because it inserts,
  // a replacement id that already exists is rejected rather than silently
  // clobbered, and that rejection aborts the whole commit.
  SupersessionWrite supersessions = 8;
}

// A single execution-memory step. On CommitMemory only the payload fields are
// read; `timestamp` is OUTPUT-ONLY (server-assigned) and populated when the
// step is read back via QueryMemory's log section.
message ExecutionLogStep {
  string step_id = 1; // caller-chosen; unique within the agent slice
  string thought_process = 2;
  string tool_used = 3;
  string tool_input = 4;
  string tool_output = 5;
  google.protobuf.Timestamp timestamp = 6; // output-only; server commit timestamp
  // OUTPUT-ONLY, like `timestamp`: the memory scope this step was read from.
  // Ignored on CommitMemory, where the scope written is CommitMemoryRequest's
  // target_scope or the route's scope, never a per-section field.
  string scope_id = 7;

  // Optional caller-supplied tags on this step, and the reason the log section
  // finally has a predicate: until this field the log took `limit` and `since`
  // and nothing else, which made it the memory type a session filter most
  // naturally applies to and the one it could not be applied to.
  //
  // Same mechanism, same rules, as VectorChunk.metadata and the graph kinds: keys
  // match `[A-Za-z0-9_.-]{1,128}`, at most 32 per step, values are opaque strings.
  // Filter on them with LogQuery.metadata.
  //
  // A step is APPEND-ONLY — reusing a step_id is a conflict, not a replace — so
  // unlike a chunk's or a node's, a step's metadata is written once and cannot be
  // rewritten. That follows from the step's own write semantics, not from a
  // different metadata rule.
  //
  // Returned with the step wherever the step is returned.
  map<string, string> metadata = 8;
}

// A semantic-memory chunk to upsert.
message VectorChunk {
  string chunk_id = 1; // caller-chosen; unique within the agent slice
  string raw_content = 2;
  // Optional precomputed embedding. When empty, the platform generates it from
  // raw_content server-side, using the managed embedding model configured for the
  // agent's location and a retrieval-document task type. When supplied, its length
  // MUST equal that location's configured embedding width or the whole commit is
  // rejected. Single-precision (32-bit) because that is the precision vectors are
  // stored at; sending double would be silently narrowed.
  repeated float embedding = 3;

  // Optional caller-supplied attribution stored with the chunk: where it came
  // from, when, what kind of thing it is. Returned with the chunk on search and
  // inspect, and usable as a pre-ranking filter on a semantic query (see
  // SemanticQuery.filters).
  //
  // Metadata is NOT embedded (only raw_content is), so putting provenance here
  // instead of inside the text keeps it out of the vector, where it would
  // otherwise dilute similarity and still not be filterable. That is the ONE rule
  // specific to chunks; everything else below is the shared mechanism, and the
  // same tags on a graph node, a graph edge, and a log step mean the same thing
  // and filter the same way.
  //
  // An upsert REPLACES the chunk's whole metadata set rather than merging into it:
  // a key absent from this map is removed.
  //
  // Keys must match `[A-Za-z0-9_.-]{1,128}`; a key outside that set is rejected
  // with INVALID_ARGUMENT. At most 32 keys per item.
  map<string, string> metadata = 4;

  // Bi-temporal valid-time window (add-temporal-vectors), both optional on write
  // and carrying exactly the meaning GraphEdge.valid_at/invalid_at carry, so one
  // temporal model covers passages and relationships alike. valid_at is when the
  // passage's content held in the world; when unset the chunk is an always-current
  // passage. invalid_at is when it ceased to hold; unset means it still holds.
  // Transaction-time (asserted/expired) is server-assigned and not expressible
  // here.
  //
  // Setting these on a plain commit is NOT supersession. A re-upsert of an existing
  // chunk_id replaces that row's content and is how a caller CORRECTS a chunk;
  // replacing a fact while preserving history is a supersession, expressed either
  // as this commit's `supersessions` section or as the standalone
  // MemoryService.SupersedeChunk. The platform never infers one from the other.
  //
  // Read back via InspectMemory, which reports a chunk's whole validity on
  // VectorChunkInfo including the server-assigned transaction-time pair.
  google.protobuf.Timestamp valid_at = 5;
  google.protobuf.Timestamp invalid_at = 6;
}

// Graph-memory writes for one commit. Edges may only connect nodes within the
// same (EnterpriseId, AgentInstanceId) slice. Edges carry an optional bi-temporal
// validity window (see GraphEdge.valid_at/invalid_at); a plain write with neither
// field set records an always-current fact. Replacing a fact while preserving
// history is the caller-driven supersession operation (CommitMemoryRequest's
// `supersessions` section, or the standalone MemoryService.SupersedeEdge), not a
// plain re-write (a re-write of the same edge_id is an idempotent upsert, not a
// close).
message GraphWrite {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
}

// The supersession section of one commit: facts being retired, each with the
// replacement that takes over from it. Two lists rather than one ordered list
// because supersessions carry no ordering semantics against each other: every
// one of them is applied in the same transaction, at the same commit timestamp.
//
// An id named here MUST NOT also appear in a write section of the same commit.
// A request that both replaces an item's content and retires that item has not
// said which it means, so it is rejected with INVALID_ARGUMENT rather than
// resolved by a precedence rule, the same treatment a request naming two
// different scopes gets, for the same reason.
message SupersessionWrite {
  repeated EdgeSupersession edges = 1;
  repeated ChunkSupersession chunks = 2;
}

// One edge supersession: close `prior_edge_id`'s valid-time window at the
// replacement's valid_at, and insert `new_edge` in the same slice. The prior edge
// stays stored and queryable as history, with its own transaction-time start
// preserved.
//
// An unknown `prior_edge_id` is NOT FOUND and aborts the WHOLE commit rather than
// being skipped. A supersession names a specific assertion to retire; if that
// assertion is not there, the caller's premise about the workspace is wrong, and
// landing the replacement anyway would record a correction to something that was
// never closed.
message EdgeSupersession {
  // The currently-held edge to close. Resolved within the caller's slice; an
  // unknown id is NotFound (never a cross-slice touch).
  string prior_edge_id = 1;

  // The replacement fact, INSERTED in the same slice. new_edge.valid_at is
  // REQUIRED: it is the supersession boundary (the prior edge's invalid_at and the
  // new edge's valid_at) and must be a concrete, non-future timestamp.
  // new_edge.edge_id must be set and differ from prior_edge_id; because the
  // replacement is inserted rather than upserted, a reused id is rejected and the
  // commit aborts. new_edge.invalid_at may be set to open the replacement already
  // closed; its transaction-time is server-assigned. The updated_at field is
  // ignored.
  GraphEdge new_edge = 2;
}

// One chunk supersession: close `prior_chunk_id`'s valid-time window at the
// replacement's valid_at, and insert `new_chunk` in the same slice. The prior
// chunk stays stored with its CONTENT INTACT and readable as history: closing a
// window writes the validity end and nothing else.
//
// An unknown `prior_chunk_id` aborts the whole commit, on the same terms as
// EdgeSupersession.
message ChunkSupersession {
  // The currently-held chunk to close. Resolved within the caller's slice; an
  // unknown id is NotFound (never a cross-slice touch).
  string prior_chunk_id = 1;

  // The replacement passage, INSERTED in the same slice. new_chunk.valid_at is
  // REQUIRED: it is the supersession boundary (the prior chunk's invalid_at and
  // the new chunk's valid_at) and must be a concrete, non-future timestamp.
  // new_chunk.chunk_id must be set and differ from prior_chunk_id; because the
  // replacement is inserted rather than upserted, a reused id is rejected and the
  // commit aborts. It carries the same content, embedding, and metadata fields a
  // committed chunk does, including server-side embedding generation when
  // `embedding` is empty.
  //
  // A replacement whose server-generated embedding the model truncates is
  // reported in CommitMemoryResponse.truncated_chunk_ids like any other chunk this
  // commit writes, and (unlike the standalone SupersedeChunk RPC, whose request
  // has no field for it) is subject to this commit's reject_on_truncation.
  VectorChunk new_chunk = 2;
}

message GraphNode {
  string node_id = 1; // caller-chosen; unique within the agent slice
  string label = 2;
  google.protobuf.Struct properties = 3; // free-form JSON properties
  // Output-only: the row's last-write commit timestamp, populated when the node
  // is read back via InspectMemory. Nodes are written create-or-replace, so this
  // is the last write, not first creation. Ignored on CommitMemory.
  google.protobuf.Timestamp updated_at = 4;

  // Optional caller-supplied tags on this node, the same mechanism VectorChunk
  // carries and with the same rules: keys match `[A-Za-z0-9_.-]{1,128}`, at most
  // 32 per item, values are opaque strings, and a write REPLACES the node's whole
  // set rather than merging into it.
  //
  // METADATA IS NOT `properties`, and the division matters. `properties` is the
  // node's PAYLOAD: arbitrary nested JSON, stored and returned, never filterable.
  // Metadata is its filterable INDEX: flat strings that a query can narrow on
  // (GraphNodeMatch.metadata). The one-line rule is "if you want to filter on it,
  // it is metadata; if it is data the node carries, it is properties" — and
  // putting the same value in both is legitimate and expected, because a flat
  // filterable copy of a nested payload field is exactly what an index is.
  //
  // Returned with the node wherever the node is returned.
  map<string, string> metadata = 5;
}

message GraphEdge {
  string edge_id = 1; // caller-chosen; unique within the agent slice
  string source_node_id = 2; // must reference a GraphNode in the same slice
  string target_node_id = 3; // must reference a GraphNode in the same slice
  string relationship_type = 4;
  google.protobuf.Struct properties = 5; // free-form JSON properties
  // Output-only: the row's last-write commit timestamp, populated when the edge
  // is read back via InspectMemory. Edges are written create-or-replace, so this
  // is the last write, not first creation. Ignored on CommitMemory.
  google.protobuf.Timestamp updated_at = 6;

  // Bi-temporal valid-time window (add-temporal-graph), both optional on write.
  // valid_at is when the fact became true in the world; when unset it defaults to
  // the edge's server-assigned creation commit timestamp (so a naive write is an
  // always-current fact). invalid_at is when the fact ceased to be true; unset
  // (absent) means the fact is still held. A caller-supplied valid_at must not be
  // future-dated. Transaction-time (created/expired) is server-assigned and not
  // expressible here. These are write-time inputs; InspectMemory does not populate
  // them on read-back in this change.
  google.protobuf.Timestamp valid_at = 7;
  google.protobuf.Timestamp invalid_at = 8;

  // Optional caller-supplied tags on this edge, on exactly the terms
  // GraphNode.metadata describes — including the payload-versus-index division
  // against `properties`. Filter on them with GraphStep.metadata.
  map<string, string> metadata = 9;
}

// The commit receipt: a commit timestamp plus how many rows were written per
// memory type, so a caller can evidence exactly what the atomic step persisted.
message CommitMemoryResponse {
  google.protobuf.Timestamp commit_timestamp = 1;

  // Rows written by the WRITE sections (`log`, `vectors`, `graph`). These count
  // what those sections wrote and nothing else; a supersession's effect is
  // reported by the two counters below rather than folded in here, so their
  // meaning is exactly what it was before the supersession section existed.
  int64 execution_log_rows = 2;
  int64 vector_rows = 3;
  int64 graph_node_rows = 4;
  int64 graph_edge_rows = 5;

  // Chunks whose SERVER-GENERATED embedding the model truncated because the
  // content exceeded the embedding model's input limit. The commit SUCCEEDED,
  // but for each id listed here the tail of `raw_content` is not represented in
  // the stored vector and is therefore unreachable by semantic search: the
  // stored content is complete, the stored embedding is not.
  //
  // Covers every chunk this commit generated an embedding for, including a
  // supersession's replacement passage.
  //
  // Ids rather than a flag or a count, so a caller knows exactly which chunk to
  // split and re-commit; a count cannot say that in a multi-chunk commit. Empty
  // means every generated chunk in this commit was embedded in full.
  //
  // Never populated for a caller-supplied embedding: the platform did not embed
  // that content, so it has nothing to report about it. A precomputed vector's
  // fidelity is the caller's own concern.
  repeated string truncated_chunk_ids = 6;

  // The scope this commit was written to: the request's target_scope when it
  // named one, otherwise the scope named by the route. Reported so a caller that
  // relies on the default can confirm which scope received the write rather than
  // inferring it.
  string scope_id = 7;

  // Supersessions applied by this commit, counted as OPERATIONS rather than rows.
  //
  // Operations, because a supersession touches two rows asymmetrically (it
  // inserts the replacement and closes the prior one's window), so a row count
  // would have to pick a number that means something different from what every
  // other counter here means. "Two facts were retired and replaced" is both what
  // the caller asked for and what these report.
  //
  // Kept separate from graph_edge_rows and vector_rows for the same reason: a
  // caller reading those counters before this section existed would otherwise see
  // them start including work it never asked about.
  int64 edge_supersessions = 8;
  int64 chunk_supersessions = 9;
}

// ---------------------------------------------------------------------------
// Query
// ---------------------------------------------------------------------------

// Request for MemoryService.QueryMemory.
//
// Any subset of the three section fields may be present. All present sections
// are evaluated at one read timestamp.
message QueryMemoryRequest {
  // DEPRECATED, superseded by `scope_id`, which names the same value for a
  // scope of either kind. Read only when `scope_id` is empty, so existing gRPC
  // callers keep working unchanged; both HTTP routes bind `scope_id`, so a REST
  // caller never populates this one. Setting both to DIFFERENT values is
  // INVALID_ARGUMENT rather than resolved by precedence, because a request that
  // names two scopes has not said which one it means.
  string agent_instance_id = 1 [deprecated = true];

  // Semantic (vector/ANN) section. Absent to skip semantic retrieval.
  SemanticQuery semantic = 2;
  // Graph (structured traversal) section. Absent to skip graph retrieval.
  GraphQuery graph = 3;
  // Execution-log recency section. Absent to skip the log.
  LogQuery log = 4;

  // When true, the semantic and graph sections are composed and an additional
  // `fused` result is returned. Requires both of those sections to be present.
  bool link = 5;
  // Fusion direction when `link` is set. Unspecified defaults to VECTOR_FIRST.
  FusionDirection fusion_direction = 6;

  // Optional as-of read timestamp, applied UNIFORMLY to every section so all
  // sections observe the same historical instant. Empty reads the latest data.
  google.protobuf.Timestamp as_of = 7;

  // Optional additional memory scopes to evaluate ALONGSIDE the scope named by
  // the route, typically a subject scope read together with an agent's own
  // workspace. Empty means the single-scope behavior that predates this field,
  // identically: same request, same evaluation, same response.
  //
  // Every section of the query is evaluated against all requested scopes in ONE
  // read snapshot, so the cross-type consistency guarantee becomes a cross-scope
  // one: no scope's result reflects a write another scope's result cannot see.
  // Semantic results are ranked TOGETHER over the union of the requested scopes,
  // so the returned set is the globally nearest rather than a per-scope top-k
  // concatenated, and every returned item names the scope it came from.
  //
  // Three refusals, all deliberate and none of them silent:
  //
  //   - A scope the caller is not authorized to reach refuses the whole query
  //     with PERMISSION_DENIED. It is never dropped from the set, because a
  //     silently narrowed set returns a partial answer indistinguishable from a
  //     complete one.
  //   - Every named scope must resolve to the SAME data-plane database. One
  //     naming a scope homed in another region is refused with an error
  //     identifying the offending scope and the mismatch, never satisfied by
  //     reading each database separately: two databases cannot share a read
  //     snapshot, so combining their results would present two instants as one
  //     consistent answer. A query naming exactly ONE scope is servable from
  //     anywhere, because routing resolves that scope to its own region.
  //   - The number of scopes in one query is bounded by a server maximum;
  //     exceeding it is refused with an error naming the limit rather than
  //     truncated to the first N. Semantic search is exact KNN, affordable
  //     because each scope is a small contiguous key range, and a multi-scope
  //     query scans one such range per scope.
  //
  // Graph traversal stays INSIDE a scope: an edge connects nodes within one
  // scope, so a multi-scope graph section returns one subgraph per requested
  // scope and never a path crossing from one into another. Where a query links
  // its semantic and graph sections, traversal expands within the scope of the
  // candidate it started from.
  repeated string additional_scopes = 8;

  // Route path parameter, never read from the body: the memory scope this query
  // addresses, of EITHER kind. Bound by both `/v1/agents/{scope_id}/...` and
  // `/v1/scopes/{scope_id}/...`, which are one operation reached two ways: the
  // agent form is the agent-kind view and the scope form is the general one.
  //
  // It replaces `agent_instance_id`, which named the same value back when a
  // workspace was the only kind of scope there was.
  string scope_id = 9;
}

// Direction of vector+graph fusion when a query links the two sections.
enum FusionDirection {
  FUSION_DIRECTION_UNSPECIFIED = 0; // treated as VECTOR_FIRST
  // ANN vector search produces candidate nodes, then the graph traverses from
  // them. This is the default.
  FUSION_DIRECTION_VECTOR_FIRST = 1;
  // Graph traversal produces a candidate set, then it is ranked by EXACT vector
  // distance (not the ANN index).
  FUSION_DIRECTION_GRAPH_FIRST = 2;
}

// Semantic-section query. Exactly one of `embedding` or `query_text` MUST be
// supplied; when `query_text` is given the gateway embeds it server-side
// (task_type RETRIEVAL_QUERY). Results are ranked by ascending cosine distance
// and clamped to the caller's agent slice (the clamp never silently truncates
// below `limit`).
message SemanticQuery {
  repeated float embedding = 1; // precomputed query embedding; width must match the db
  string query_text = 2; // embedded server-side when `embedding` is absent
  int32 limit = 3; // max matches to return

  // Optional metadata predicates narrowing the candidate set. All must match
  // (conjunctive); at most 8 per section, and more is rejected with
  // INVALID_ARGUMENT.
  //
  // Each filter compares a metadata key against a value with an operator:
  // OPERATOR_EQUALS (the default when unset), or one of OPERATOR_LESS_THAN,
  // OPERATOR_LESS_THAN_OR_EQUAL, OPERATOR_GREATER_THAN,
  // OPERATOR_GREATER_THAN_OR_EQUAL. A bounded range is two filters on the same
  // key, e.g. date >= "2026-07-01" AND date <= "2026-07-31".
  //
  // ORDERED COMPARISON IS LEXICOGRAPHIC, over the stored string. A metadata value
  // carries no type tag and the platform does not infer one, so comparison is byte
  // order, NOT numeric.
  //
  // A chunk that does not carry the filtered key matches NO operator, including
  // OPERATOR_EQUALS: there is no value to compare or order against, so absence
  // excludes.
  //
  // Filters are evaluated in the WHERE clause BEFORE ranking, never as a
  // post-filter over an already-limited result set. So the returned chunks are the
  // nearest `limit` AMONG the chunks matching the filters, not the filters applied
  // to an unfiltered nearest-`limit` set, which would return fewer results (often
  // zero) for reasons a caller could not predict.
  //
  // A filtered section MAY therefore return fewer than `limit` results when fewer
  // chunks match. That is the caller's own narrowing and is reproducible from the
  // filters; it is NOT the silent truncation the tenant/agent clamp guarantees
  // against.
  repeated MetadataFilter filters = 4;

  // Bi-temporal time-travel over chunk validity (add-temporal-vectors), named and
  // behaving IDENTICALLY to GraphQuery.as_of_valid/as_of_tx so one temporal model
  // serves the whole memory surface. Absent as_of_valid means the default filter:
  // only currently-held chunks. A set as_of_valid switches to valid-time interval
  // containment (chunks whose valid-time window contains that instant), so the
  // search reconstructs the passages believed current at that point in time,
  // including ones since superseded. A set as_of_tx additionally constrains
  // transaction-time ("as known at as_of_tx"), and is only meaningful together with
  // as_of_valid.
  //
  // A chunk written before this capability existed has no valid-time and is treated
  // as valid for all time, so it is returned by any as_of_valid instant rather than
  // vanishing from history it predates.
  //
  // Supplying the same as_of_valid to this section and to the graph section
  // reconstructs a CROSS-MODAL past belief: the passages and the relationships the
  // agent held at that instant, consistent with one another.
  //
  // This is NOT QueryMemoryRequest.as_of. That field moves the physical read
  // snapshot and is bounded by the backend's version-retention window (about an
  // hour); valid-time is a bound predicate over stored columns evaluated at the
  // current snapshot, so it reaches arbitrarily far back. Both bounds bind as query
  // parameters and are injected alongside the tenant/agent clamp, which cannot be
  // omitted or widened.
  google.protobuf.Timestamp as_of_valid = 5;
  google.protobuf.Timestamp as_of_tx = 6;
}

// One predicate over an ITEM's metadata — a vector chunk, a graph node, a graph
// edge, or an execution-log step. It is the same message in every section that
// accepts a filter (SemanticQuery.filters, GraphNodeMatch.metadata,
// GraphStep.metadata, LogQuery.metadata) with the same semantics, so a caller
// learns one grammar and gets the same answer whichever memory type the question
// is about.
message MetadataFilter {
  // Operator selects how `value` is compared against the item's stored value
  // for `key`.
  //
  // An item that does not carry `key` at all matches NO operator, including
  // EQUALS: there is no value to compare or order against, so absence excludes.
  // Filters combine conjunctively (all must match); there is no disjunction
  // between them.
  enum Operator {
    OPERATOR_UNSPECIFIED = 0; // treated as EQUALS
    OPERATOR_EQUALS = 1;
    // Ordered comparisons. Each reads "the item's stored value <op> `value`",
    // e.g. OPERATOR_GREATER_THAN_OR_EQUAL with value "2026-07-01" matches
    // items whose stored value sorts at or after that string. A bounded range
    // is two filters on the same key.
    //
    // Comparison is LEXICOGRAPHIC over the stored string. There is no type tag on
    // a metadata value and the platform never infers one, so encode for the order
    // you want: ISO-8601 dates and zero-padded numbers sort correctly, "9" and
    // "10" do not.
    OPERATOR_LESS_THAN = 2;
    OPERATOR_LESS_THAN_OR_EQUAL = 3;
    OPERATOR_GREATER_THAN = 4;
    OPERATOR_GREATER_THAN_OR_EQUAL = 5;
  }

  string key = 1;
  string value = 2;
  Operator operator = 3;
}

// Graph-section query: a STRUCTURED traversal over the agent's knowledge graph.
// The platform ensures graph queries remain within the caller's authorized
// (EnterpriseId, AgentInstanceId) slice.
//
// A query is an anchor node set plus zero or more single-hop traversals. Each
// hop is one `GraphStep`; multi-hop traversal is expressed as successive steps.
message GraphQuery {
  GraphNodeMatch start = 1; // anchor node set the traversal begins from
  repeated GraphStep steps = 2; // single-hop traversals; empty returns the anchor set
  int32 limit = 3; // max rows; <= 0 uses the default, clamped to a server max

  // Bi-temporal time-travel over edge validity (add-temporal-graph). Absent
  // as_of_valid means the default filter: only currently-held edges (invalid_at
  // and expired are both open). A set as_of_valid switches to valid-time interval
  // containment (edges whose valid-time window contains that instant), so the
  // traversal reconstructs the facts believed true at that point in time. A set
  // as_of_tx additionally constrains transaction-time ("as known at as_of_tx"),
  // and is only meaningful together with as_of_valid.
  //
  // Graph valid-time is evaluated as a bound predicate over the validity columns
  // at the current snapshot, never by moving
  // the physical read timestamp. Both bounds bind as query parameters; the clamp
  // is injected onto every hop exactly like the tenant/agent clamp and cannot be
  // omitted or widened.
  google.protobuf.Timestamp as_of_valid = 4;
  google.protobuf.Timestamp as_of_tx = 5;
}

// A node-pattern constraint. `label` optionally filters the node's semantic
// `Label` property (e.g. "Person"); `filters` are optional equality predicates.
// The gateway always adds the (EnterpriseId, AgentInstanceId) clamp to the
// generated element: it is NOT expressible here and cannot be overridden.
message GraphNodeMatch {
  string label = 1; // optional equality filter on the node's `Label`
  repeated PropertyFilter filters = 2; // optional property equality filters (values bound)

  // Optional metadata filters on this node, using the same MetadataFilter message
  // and the same semantics the semantic and log sections use.
  //
  // THIS IS A SEPARATE LIST FROM `filters`, and it stays separate deliberately.
  // `filters` names FIRST-CLASS COLUMNS and is allowlisted (`NodeId`, `Label`) so
  // that a caller cannot filter on a clamp column. If the two lists merged,
  // resolving a key would mean asking "is this the name of a column?", which would
  // hand a caller-chosen string the power to pick which branch it takes and make a
  // metadata key named `AgentInstanceId` a question rather than an answer. Two
  // lists means a key's meaning is fixed by which list it is in.
  //
  // The rule for choosing: filtering a stored column (`NodeId`, `Label`) is
  // `filters`; filtering a tag you wrote in GraphNode.metadata is `metadata`.
  //
  // Applied to the matched node BEFORE the traversal expands from it, so a
  // non-matching anchor is never expanded rather than expanded and discarded.
  repeated MetadataFilter metadata = 3;
}

// One single-hop traversal to an adjacent node.
message GraphStep {
  string relationship_type = 1; // optional equality filter on the edge's `RelationshipType`
  GraphDirection direction = 2; // direction relative to the current node
  GraphNodeMatch node = 3; // constraints on the node reached by this hop

  // Optional metadata filters on the EDGE this hop traverses (not on the node it
  // reaches — that is `node.metadata`). Same message, same semantics, and applied
  // to the edge element before the hop is taken.
  repeated MetadataFilter metadata = 4;
}

// Traversal direction of a hop relative to the current node.
enum GraphDirection {
  GRAPH_DIRECTION_UNSPECIFIED = 0; // treated as OUTGOING
  GRAPH_DIRECTION_OUTGOING = 1; // (current)-[edge]->(next)
  GRAPH_DIRECTION_INCOMING = 2; // (current)<-[edge]-(next)
  GRAPH_DIRECTION_ANY = 3; // (current)-[edge]-(next), either direction
}

// A single equality filter on a FIRST-CLASS COLUMN of the node. `key` is
// ALLOWLISTED to `NodeId` and `Label`; any other key is rejected with
// INVALID_ARGUMENT. `value` binds as a query parameter and is never interpolated
// into query text.
//
// The allowlist is what keeps a caller off the clamp columns, so it is narrow on
// purpose and does not fall back to anything. In particular it does NOT reach into
// `properties`: that field is a payload and is not filterable at all, because
// filtering a JSON column needs a caller-supplied key inside a JSON path and that
// is an injection surface the platform does not open. To filter on something a
// node carries, tag it in GraphNode.metadata and use GraphNodeMatch.metadata.
message PropertyFilter {
  string key = 1;
  google.protobuf.Value value = 2;
}

// Execution-log-section query: the agent's most recent steps in commit-
// timestamp order.
message LogQuery {
  int32 limit = 1; // max steps to return
  google.protobuf.Timestamp since = 2; // optional recency lower bound

  // Optional metadata filters on the steps, using the same MetadataFilter message
  // and the same semantics as every other section.
  //
  // APPLIED BEFORE `limit` SELECTS, not after. Asking for the 20 most recent steps
  // tagged `session=s-991` returns the 20 most recent steps THAT CARRY THAT TAG,
  // not the 20 most recent steps of any kind filtered down to whichever happen to
  // match. Those are very different answers when another session has been busier,
  // and the second one silently returns nothing.
  //
  // A filtered section returning fewer steps than `limit` means fewer steps
  // matched. That is the caller's own narrowing and is reproducible from the
  // filter; it is not the truncation the tenant clamp forbids.
  repeated MetadataFilter metadata = 3;
}

// Response for MemoryService.QueryMemory. Each result section is present only
// when its corresponding request section was supplied. `fused` is present only
// when the request set `link`.
message QueryMemoryResponse {
  SemanticResult semantic = 1;
  GraphResult graph = 2;
  LogResult log = 3;
  FusedResult fused = 4;
  // The single read timestamp every section was evaluated at.
  google.protobuf.Timestamp read_timestamp = 5;
}

message SemanticResult {
  repeated SemanticMatch matches = 1;
}

message SemanticMatch {
  string chunk_id = 1;
  string raw_content = 2;
  double distance = 3; // cosine distance; smaller is closer

  // The chunk's stored metadata, read in the same snapshot as the hit, so a hit
  // and its attribution can never disagree. Empty when the chunk has none.
  map<string, string> metadata = 4;

  // The memory scope this match came from. Always populated, including for a
  // single-scope query, so attributing a recalled memory to its origin never
  // depends on how the query was shaped. Chunk ids are unique within a scope,
  // not across scopes, so this is what makes a fused ranking attributable.
  string scope_id = 5;
}

// Graph traversal result rows. Each row carries the matched elements' key
// fields (node ids and labels, and edge relationship types) keyed by gateway-
// assigned binding names, so the shape is carried as a structured value rather
// than a fixed schema.
//
// Scope provenance rides in the row itself, under the reserved key `_scope`,
// rather than as a field beside it: the row has no fixed schema to add a field
// to, and a parallel array would have to stay index-aligned with one. The key
// cannot collide with a caller's binding, because binding names are assigned by
// the gateway and never taken from the request. Every row carries it, including
// for a single-scope query, and no returned path crosses scopes, so one row
// names exactly one scope.
message GraphResult {
  repeated google.protobuf.Struct rows = 1;
}

message LogResult {
  repeated ExecutionLogStep steps = 1; // timestamp-populated records, newest first
}

// The linked semantic+graph view. Its exact shape depends on fusion direction
// and is carried as structured values until the fused-result schema is pinned
// down; see the unified-memory spec's fusion requirements.
//
// Each item names its scope under the reserved key `_scope`, on the same terms
// as GraphResult. A fused item never joins a chunk in one scope to an entity in
// another, because traversal expands within the scope of the candidate it
// started from, so one item names exactly one scope.
message FusedResult {
  repeated google.protobuf.Struct items = 1;
}

// ---------------------------------------------------------------------------
// Inspect
// ---------------------------------------------------------------------------

// Request for MemoryService.InspectMemory.
//
// Any subset of the three section fields may be present; at least one SHOULD
// be. All present sections are enumerated at one read snapshot within the
// caller's (EnterpriseId, AgentInstanceId) slice. There is no query anchor:
// unlike QueryMemory this lists stored rows for debugging, so a section is
// requested simply by being present, bounded by its limit.
message InspectMemoryRequest {
  // DEPRECATED, superseded by `scope_id`, which names the same value for a
  // scope of either kind. Read only when `scope_id` is empty, so existing gRPC
  // callers keep working unchanged; both HTTP routes bind `scope_id`, so a REST
  // caller never populates this one. Setting both to DIFFERENT values is
  // INVALID_ARGUMENT rather than resolved by precedence, because a request that
  // names two scopes has not said which one it means.
  string agent_instance_id = 1 [deprecated = true];

  // Vector section: list stored chunks (content only). Absent to skip vectors.
  InspectVectors vectors = 2;
  // Graph section: list stored nodes and edges. Absent to skip the graph.
  InspectGraph graph = 3;
  // Execution-log section: list recent steps. Absent to skip the log.
  InspectLog log = 4;

  // Optional as-of read timestamp, applied UNIFORMLY to every section so all
  // sections observe the same historical instant. Empty reads the latest data.
  google.protobuf.Timestamp as_of = 5;

  // Route path parameter, never read from the body: the memory scope this
  // inspection
  // addresses, of EITHER kind. Bound by both `/v1/agents/{scope_id}/...` and
  // `/v1/scopes/{scope_id}/...`, which are one operation reached two ways: the
  // agent form is the agent-kind view and the scope form is the general one.
  //
  // It replaces `agent_instance_id`, which named the same value back when a
  // workspace was the only kind of scope there was.
  string scope_id = 6;
}

// Vector-section listing request. Enumerates stored chunks; the embedding vector
// is never included in the response (it is large and not human-inspectable).
message InspectVectors {
  int32 limit = 1; // max chunks; <= 0 uses the default, clamped to a server max

  // Resume a walk of this listing. Empty starts one. Pass back the
  // `next_chunk_token` from the prior response; when that comes back EMPTY the
  // listing is exhausted and there is nothing further to fetch.
  //
  // The token is opaque and server-generated. Do not construct, parse, or edit
  // one: a token the server cannot interpret is REJECTED with INVALID_ARGUMENT
  // rather than quietly restarting from the first page, because a silent restart
  // would hand a caller walking to exhaustion a partial listing that looks
  // complete.
  string page_token = 2;
}

// Graph-section listing request. Enumerates stored nodes and edges independently
// (this is a raw dump, not a traversal), each bounded by its own limit.
message InspectGraph {
  int32 node_limit = 1; // max nodes; <= 0 uses the default, clamped to a server max
  int32 edge_limit = 2; // max edges; <= 0 uses the default, clamped to a server max

  // Nodes and edges are walked INDEPENDENTLY: a workspace typically holds far
  // more edges than nodes, so one shared cursor would stall the longer listing or
  // re-deliver the shorter one. Pass back `next_node_token` / `next_edge_token`
  // from the prior response; empty means that listing is exhausted. Opaque and
  // server-generated; see InspectVectors.page_token.
  string node_page_token = 3;
  string edge_page_token = 4;
}

// Execution-log-section listing request: the agent's most recent steps in
// commit-timestamp order (newest first). Mirrors LogQuery so callers can follow
// the log incrementally (poll with `since` advanced to the prior read).
message InspectLog {
  int32 limit = 1; // max steps to return
  google.protobuf.Timestamp since = 2; // optional recency lower bound

  // Resume a walk of the step listing; empty starts one. Pass back
  // `next_log_token`; empty means exhausted. Opaque and server-generated; see
  // InspectVectors.page_token.
  string page_token = 3;
}

// Response for MemoryService.InspectMemory. Each result section is present only
// when its corresponding request section was supplied.
message InspectMemoryResponse {
  VectorInspectResult vectors = 1;
  GraphInspectResult graph = 2;
  LogResult log = 3; // same ExecutionLogStep records as QueryMemory
  // The single read timestamp every section was evaluated at.
  google.protobuf.Timestamp read_timestamp = 4;

  // Continuation tokens, one per listing. An EMPTY token means that listing is
  // EXHAUSTED, not merely that this page ended, so a caller can tell "this is
  // everything held" from "this is the first page of an unknown amount". Feed a
  // token back on the matching request section to fetch the next page.
  //
  // Listings exhaust independently: a workspace with many chunks and few log steps
  // reports the log done while chunks still have more.
  //
  // These live on the response rather than inside each result message because
  // `LogResult` is shared with QueryMemory, which returns a bounded slice of
  // recent steps rather than an enumerable listing and has nothing to continue.
  //
  // CONSISTENCY: pages are independently snapshotted, so a commit landing mid-walk
  // may appear. Set `as_of` on every request of the walk for a stable view,
  // bounded by the backend's version-retention window (about an hour).
  string next_chunk_token = 5;
  string next_node_token = 6;
  string next_edge_token = 7;
  string next_log_token = 8;
}

message VectorInspectResult {
  repeated VectorChunkInfo chunks = 1;
}

// A stored vector chunk WITHOUT its embedding. The embedding column is
// deliberately omitted: it is large and carries no debugging value in a listing.
message VectorChunkInfo {
  string chunk_id = 1;
  string raw_content = 2;
  // Output-only: the chunk's last-write commit timestamp. Chunks are upserted, so
  // this is the last write, not first creation.
  google.protobuf.Timestamp updated_at = 3;

  // Output-only truncation state of the STORED embedding, so already-written
  // history can be audited and not merely newly-written chunks.
  //
  // Both fields use explicit presence, and ABSENT IS MEANINGFUL: it means the
  // chunk predates truncation tracking, so its state was never measured. A
  // reader MUST NOT treat absent as "not truncated": conflating unknown with
  // known-good is the exact failure this reporting exists to remove.
  //
  // Present-and-false means measured and embedded in full. That includes a chunk
  // whose embedding the caller supplied: the platform embedded nothing there, so
  // it truncated nothing.
  //
  // `token_count` is the number of tokens the model counted in the content it
  // was GIVEN, not in the prefix it embedded. So when `truncated` is true this
  // value EXCEEDS the model's input limit rather than equalling it, which makes
  // it directly useful for sizing: `token_count` divided by the limit is roughly
  // how many pieces the content needs splitting into. Absent whenever no
  // embedding was generated server-side.
  optional bool truncated = 4;
  optional int64 token_count = 5;

  // The chunk's stored metadata. Empty when the chunk has none.
  map<string, string> metadata = 6;

  // Output-only bi-temporal validity (add-temporal-vectors). Inspect lists what a
  // workspace HOLDS, and a superseded passage is still held, so the listing keeps
  // returning it and reports its validity here instead. Semantic search is the
  // surface that shows what is CURRENT; the two answer different questions on
  // purpose, and a caller that wants only live passages should search rather than
  // filter this listing.
  //
  // valid_at / invalid_at are the valid-time window: when the passage's content
  // held in the world. asserted_at / expired_at are the transaction-time window:
  // when the platform asserted it. A chunk with both ENDS absent (invalid_at and
  // expired_at) is currently held.
  //
  // ABSENCE IS MEANINGFUL and differs per field. An absent invalid_at or expired_at
  // means the window is still open. An absent valid_at means the passage is valid
  // for all time, which is what every chunk written before this capability existed
  // is, so a reader MUST NOT treat it as a missing value to be defaulted. An absent
  // asserted_at means the same thing one level over: the chunk predates the
  // assertion-start column and the platform cannot say when it was first asserted.
  //
  // asserted_at is ASSIGN-ONCE, and it is the field that answers "when was this
  // first written". `updated_at` above cannot: chunks are upserted, so it moves
  // every time a caller corrects one.
  google.protobuf.Timestamp valid_at = 7;
  google.protobuf.Timestamp invalid_at = 8;
  google.protobuf.Timestamp asserted_at = 9;
  google.protobuf.Timestamp expired_at = 10;
}

// Graph listing result: the stored nodes and edges themselves (reusing the same
// GraphNode/GraphEdge shapes CommitMemory writes), NOT traversal rows.
message GraphInspectResult {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
}

// ---------------------------------------------------------------------------
// Supersede
// ---------------------------------------------------------------------------

// Request for MemoryService.SupersedeEdge.
message SupersedeEdgeRequest {
  // DEPRECATED, superseded by `scope_id`, which names the same value for a
  // scope of either kind. Read only when `scope_id` is empty, so existing gRPC
  // callers keep working unchanged; both HTTP routes bind `scope_id`, so a REST
  // caller never populates this one. Setting both to DIFFERENT values is
  // INVALID_ARGUMENT rather than resolved by precedence, because a request that
  // names two scopes has not said which one it means.
  string agent_instance_id = 1 [deprecated = true];

  // The currently-held edge to close. Resolved within the caller's slice; an
  // unknown id is NotFound (never a cross-slice touch).
  string prior_edge_id = 2;

  // The replacement fact, inserted in the same slice. new_edge.valid_at is
  // REQUIRED: it is the supersession boundary (the prior edge's invalid_at and
  // the new edge's valid_at) and must be a concrete timestamp. new_edge.edge_id
  // must be set and differ from prior_edge_id (the replacement is inserted, not
  // upserted, so a reused id is rejected). new_edge.invalid_at may be set to open
  // the replacement already closed; its transaction-time is server-assigned. The
  // updated_at field is ignored.
  GraphEdge new_edge = 3;

  // Route path parameter, never read from the body: the memory scope this
  // supersession
  // addresses, of EITHER kind. Bound by both `/v1/agents/{scope_id}/...` and
  // `/v1/scopes/{scope_id}/...`, which are one operation reached two ways: the
  // agent form is the agent-kind view and the scope form is the general one.
  //
  // It replaces `agent_instance_id`, which named the same value back when a
  // workspace was the only kind of scope there was.
  string scope_id = 4;
}

// The supersession receipt: the commit timestamp of the transaction that closed
// the prior edge and inserted the replacement.
message SupersedeEdgeResponse {
  google.protobuf.Timestamp commit_timestamp = 1;
}

// Request for MemoryService.SupersedeChunk.
message SupersedeChunkRequest {
  // DEPRECATED, superseded by `scope_id`, which names the same value for a
  // scope of either kind. Read only when `scope_id` is empty, so existing gRPC
  // callers keep working unchanged; both HTTP routes bind `scope_id`, so a REST
  // caller never populates this one. Setting both to DIFFERENT values is
  // INVALID_ARGUMENT rather than resolved by precedence, because a request that
  // names two scopes has not said which one it means.
  string agent_instance_id = 1 [deprecated = true];

  // The currently-held chunk to close. Resolved within the caller's slice; an
  // unknown id is NotFound (never a cross-slice touch). Its content is left
  // intact: closing a window writes the validity end and nothing else, so the
  // superseded passage stays readable as history.
  string prior_chunk_id = 2;

  // The replacement passage, inserted in the same slice. new_chunk.valid_at is
  // REQUIRED: it is the supersession boundary (the prior chunk's invalid_at and the
  // new chunk's valid_at) and must be a concrete timestamp. new_chunk.chunk_id must
  // be set and differ from prior_chunk_id (the replacement is inserted, not
  // upserted, so a reused id is rejected). It carries the same content, embedding,
  // and metadata fields a committed chunk does, including server-side embedding
  // generation when `embedding` is empty.
  VectorChunk new_chunk = 3;

  // Route path parameter, never read from the body: the memory scope this
  // supersession
  // addresses, of EITHER kind. Bound by both `/v1/agents/{scope_id}/...` and
  // `/v1/scopes/{scope_id}/...`, which are one operation reached two ways: the
  // agent form is the agent-kind view and the scope form is the general one.
  //
  // It replaces `agent_instance_id`, which named the same value back when a
  // workspace was the only kind of scope there was.
  string scope_id = 4;
}

// The supersession receipt: the commit timestamp of the transaction that closed
// the prior chunk and inserted the replacement.
message SupersedeChunkResponse {
  google.protobuf.Timestamp commit_timestamp = 1;

  // Set when the replacement's embedding was generated server-side and the model
  // truncated it, mirroring CommitMemoryResponse.truncated_chunk_ids for the single
  // chunk this operation writes. The supersession SUCCEEDED; the tail of the
  // replacement's raw_content is not represented in its stored vector.
  bool truncated = 2;
}

// ---------------------------------------------------------------------------
// Formation
// ---------------------------------------------------------------------------

// Who produced one conversation turn. Required on every turn: an unset role is
// INVALID_ARGUMENT rather than defaulted, because defaulting attributes a
// statement to the wrong speaker, and who said a thing is most of what decides
// whether it is worth remembering ("I live in Tokyo" from the user is a fact
// about the user; the same sentence from the assistant may be a guess).
enum TurnRole {
  TURN_ROLE_UNSPECIFIED = 0;
  TURN_ROLE_USER = 1;
  TURN_ROLE_ASSISTANT = 2;
  // A system/developer instruction. Extraction reads it as context for the other
  // turns, not as a source of facts about the world.
  TURN_ROLE_SYSTEM = 3;
  // A tool result rendered into the conversation. Prefer ConversationTurn.tools
  // where the invocation is structured; this role is for a transcript that
  // already flattened it into a turn.
  TURN_ROLE_TOOL = 4;
}

// One tool invocation that occurred at a turn. Field names match
// ExecutionLogStep's deliberately: the submitted turns are persisted as an
// execution-log step by the same formation that reads them, so the two describe
// the same thing with the same words.
message ToolTrace {
  string tool_used = 1;
  string tool_input = 2;
  string tool_output = 3;
}

// One conversation turn submitted for formation.
message ConversationTurn {
  TurnRole role = 1;
  // What was said. This text is sent to an external inference service as
  // written; see FormMemory.
  string content = 2;
  // Optional tool invocations that occurred at this turn.
  repeated ToolTrace tools = 3;
}

// Request for MemoryService.FormMemory.
//
// It carries CONVERSATION, never authored writes. A request that also named a
// chunk, a node, or an edge to write would make it ambiguous which memory the
// platform chose and which the caller did, so there is no field for one and a
// caller wanting both makes two calls: CommitMemory for what it authored,
// FormMemory for what it wants decided.
//
// There is deliberately no `/v1/scopes/{scope_id}/memory:form` binding beside
// the agent one, unlike every other operation on this service. Formation is
// specified for an agent workspace in this version; reaching it for a subject
// scope raises a question this change does not answer (which scope's held
// memory reconciliation judges against), and a route is easier to add later
// than to narrow.
message FormMemoryRequest {
  // Route path parameter, never read from the body: the agent workspace this
  // formation reads and writes. Every stage is clamped to the caller's
  // (EnterpriseId, this scope) slice: extraction has no field that could widen
  // it, and recall and commit take the same clamped paths CommitMemory and
  // QueryMemory take.
  string scope_id = 1;

  // The conversation to form memory from, in order. Order is meaningful:
  // extraction resolves references across turns ("she", "that one", "the second
  // option"), so a shuffled transcript forms different memory.
  //
  // Bounded on two axes, both rejected before the model call rather than
  // truncated: the number of turns, and the total input tokens they amount to.
  // An oversize submission is INVALID_ARGUMENT naming the bound it exceeded,
  // because silently forming memory from a prefix would leave the caller
  // believing the tail was considered.
  repeated ConversationTurn turns = 2;

  // An optional caller-chosen key making this formation SAFELY RESENDABLE.
  //
  // It is more load-bearing here than an idempotency key usually is. Extraction
  // is nondeterministic, so a blind resend does not repeat the first attempt: it
  // forms a second, different set of memory alongside the first. Where this key
  // is set, a resend returns the FIRST call's receipt and re-extracts nothing.
  //
  // It is also what makes a lost race recoverable. Two concurrent formations
  // that decide to supersede the same assertion cannot both win: the loser's
  // replacement is rejected and its whole formation aborts. The safe response to
  // that is to resend, which needs this key to be safe.
  //
  // Scoped to the workspace. Unset means no protection: the platform cannot tell
  // a resend from a second conversation that happened to be identical.
  //
  // A RESEND IS NOT MARKED AS ONE, on the same terms DataService.CommitData does
  // not mark one: a resend asks "was my intent carried out", the answer is yes,
  // and the receipt is the evidence. Whether a given response was produced by
  // doing the work or by reading the record is a fact about the platform's
  // plumbing, not about the caller's memory, and the memory a replayed receipt
  // describes is exactly as durable and exactly as explained either way.
  string formation_key = 3;
}

// What kind of memory a candidate is.
enum CandidateKind {
  CANDIDATE_KIND_UNSPECIFIED = 0;
  // A self-contained statement worth remembering, stored semantically as a
  // vector chunk.
  CANDIDATE_KIND_FACT = 1;
  // A typed, directed assertion between two named entities, stored as graph
  // nodes and an edge.
  CANDIDATE_KIND_RELATIONSHIP = 2;
}

// What reconciliation decided about one candidate.
enum MemoryDecision {
  MEMORY_DECISION_UNSPECIFIED = 0;
  // The scope does not hold this. Written as an idempotent chunk, node, and/or
  // edge, under an id derived from the candidate's own normalized content.
  MEMORY_DECISION_NEW = 1;
  // The scope holds an assertion this candidate replaces. Written as a
  // SUPERSESSION: the prior assertion's valid-time window is closed and a
  // replacement is inserted, both remaining stored and queryable. Never an
  // overwrite of the prior row.
  MEMORY_DECISION_REVISED = 2;
  // The scope already holds this. Nothing is written.
  MEMORY_DECISION_KNOWN = 3;
  // NOT a reconciliation outcome, and the reason this enum has a fourth value.
  // The candidate never became memory: it failed the same validation a
  // caller-supplied value faces on CommitMemory, or its decision could not be
  // carried out without losing history. It is reported rather than dropped
  // silently, so a caller can see that extraction found something the platform
  // declined to write. See FormedCandidate.rejection_reason.
  MEMORY_DECISION_REJECTED = 4;
}

// One candidate extraction produced, and what became of it.
//
// This is what makes a formation explainable after the fact: a caller can answer
// "why does my scope hold this memory" and "why was this conversation not
// remembered" from these records alone, without access to the model call.
message FormedCandidate {
  // The id derived from this candidate's normalized content within the scope.
  // For a written candidate it is the id of the row that was written: the chunk
  // id for a fact, the edge id for a relationship. Deriving it from content
  // rather than at random is what makes an identically-worded fact re-extracted
  // later land on the same row instead of accumulating a near-duplicate.
  //
  // It IDENTIFIES the row; it is not a way to fetch it. No memory type has a
  // by-id read (retrieval is semantic search, graph traversal, and the
  // InspectMemory listings), so this id is for correlating a receipt with rows
  // you have in hand, not for looking one up.
  string candidate_id = 1;

  CandidateKind kind = 2;

  // The candidate as extraction expressed it: for a fact, the text stored as the
  // chunk's content; for a relationship, a readable rendering of the triple the
  // three fields below carry structurally.
  string text = 3;

  // Populated for CANDIDATE_KIND_RELATIONSHIP only, so the receipt carries the
  // triple rather than only a rendering of it.
  string source_entity = 4;
  string relationship_type = 5;
  string target_entity = 6;

  MemoryDecision decision = 7;

  // The existing memory this candidate was reconciled against, when there was
  // one. For MEMORY_DECISION_REVISED it is the assertion that was RETIRED (the
  // supersession's prior id), whose content stays readable by an as-of query.
  // For MEMORY_DECISION_KNOWN it is the memory already holding this fact, which
  // is why nothing was written. Empty for a new candidate.
  string matched_id = 8;

  // Why the platform declined to write this candidate. Populated only with
  // MEMORY_DECISION_REJECTED, and stated in terms of the rule that refused it
  // (an invalid metadata key, an unusable identifier, a revision that could not
  // preserve history), never as a sanitized value that was written instead.
  string rejection_reason = 9;

  // True when this candidate's `text` RETAINS a structure from the conversation (a
  // table, a fenced block) rather than describing one, so the individual entries
  // stay readable in what was stored and an ordinary semantic query can return
  // them.
  //
  // It is the platform's finding, not the extractor's claim. A model asserting
  // preservation is believed only when the turn it names is one the platform
  // itself judged structure-bearing AND the stored text really does contain a
  // structure; a claim failing either check produces an ordinary candidate with
  // this field false, and the turn is then listed in
  // FormMemoryResponse.summarized_structures. False on almost every candidate,
  // which is the intended state: preservation gives back the compression formation
  // exists to provide, so it fires only where summarising would discard entries.
  bool preserves_structure = 10;
}

// One masking the egress scrubber applied to a submitted turn before that turn
// reached the inference service.
//
// EXPECTED TO BE EMPTY. The configured scrubber masks nothing (see the
// `drop-secrets-redaction` change), so today this list is always empty and the
// turns reach the model as written. It is reported rather than assumed so that a
// caller reads the actual behavior from the receipt instead of inferring it, and
// so that wiring a real detector later needs no contract change.
message RedactionRecord {
  // Index into FormMemoryRequest.turns of the turn that was masked.
  int32 turn_index = 1;
  // How many replacements the scrubber made in that turn. The scrubber reports a
  // count and not what it matched, so this receipt does not claim to either.
  int32 masked_count = 2;
}

// One structure-bearing passage the platform recognised in a submitted turn and
// that no stored candidate preserved: its entries were summarised away, and are
// NOT retrievable from the memory this formation wrote.
//
// SHAPED AFTER RedactionRecord DELIBERATELY. Same fields, same reason for
// existing, same expectation that the list is usually empty: both report something
// the platform did to a caller's content that the caller cannot otherwise see, and
// both name the turn it happened to rather than trying to quote it back.
//
// It is NOT an error, and a formation that reports one still succeeded. The fact
// the model wrote about the structure is stored and is ordinary memory; what this
// says is that a question about a specific ROW of it will not be answerable from
// what was stored, so a caller who needs that should submit the content through
// CommitMemory, where they choose the chunking themselves.
//
// WHAT IT CANNOT TELL YOU: only structures the platform RECOGNISED are listed.
// Recognition is deliberately narrow (markdown pipe tables and fenced blocks), so
// a schedule written as prose, or one arriving in a tool trace, is summarised
// exactly as it was before this field existed and appears nowhere here. An empty
// list means nothing recognised was lost, not that nothing was lost.
message SummarizedStructure {
  // Index into FormMemoryRequest.turns of the turn the structure was found in.
  int32 turn_index = 1;

  // What that turn held, for a person reading a receipt: "1 table",
  // "2 code blocks", "1 table and 1 code block". Prose rather than an enum and a
  // count, because this field exists to be read by whoever is deciding whether to
  // resubmit the content, and a machine that wants to branch on it only needs to
  // know the list is non-empty.
  //
  // It describes EVERYTHING the turn held, not only what was lost. Read it with
  // `summarized_count`.
  string description = 2;

  // How many of that turn's structures no stored candidate preserved.
  //
  // A COUNT AND NOT AN IDENTIFICATION, and the difference is a limit worth being
  // plain about. A candidate records the TURN it preserved from, so in a turn
  // holding three tables of which one was preserved, the platform knows two were
  // lost and does not know which two. Naming one would be inventing precision the
  // receipt does not have. The turn a caller submitted is the unit they can act on
  // anyway: resubmitting it through CommitMemory stores all three, chunked the way
  // they chose.
  int32 summarized_count = 3;
}

// The formation receipt: what was extracted, what was decided, and what the
// resulting commit persisted.
//
// A receipt reporting zero candidates is a SUCCESSFUL formation of nothing, and
// is deliberately distinguishable from a refusal: a formation refused for
// exceeding its limit returns an error naming the limit, never a receipt.
message FormMemoryResponse {
  // The commit timestamp of the single transaction this formation's writes
  // landed in. Unset when the formation wrote nothing.
  google.protobuf.Timestamp commit_timestamp = 1;

  // Rows written by that commit, on exactly the terms CommitMemoryResponse
  // reports them: the write sections count rows, supersessions count operations.
  int64 execution_log_rows = 2;
  int64 vector_rows = 3;
  int64 graph_node_rows = 4;
  int64 graph_edge_rows = 5;
  int64 edge_supersessions = 6;
  int64 chunk_supersessions = 7;

  // Every candidate extraction produced, with its decision. Ordered as
  // extraction produced them.
  repeated FormedCandidate candidates = 8;

  // What the egress scrubber masked before the turns reached the model. Empty
  // while no detector is configured, which is the current and documented state.
  repeated RedactionRecord redactions = 9;

  // The per-formation candidate ceiling in force, and how many extracted
  // candidates it discarded. Reported rather than applied silently: a caller
  // seeing `candidates_dropped` above zero knows the conversation held more than
  // one formation can carry and should be submitted in pieces. Zero dropped
  // means every extracted candidate is accounted for in `candidates`.
  int32 candidate_cap = 10;
  int32 candidates_dropped = 11;

  // The scope this formation wrote to, echoed for the same reason CommitMemory
  // echoes it.
  string scope_id = 12;

  // Structures the platform saw in the submitted turns and that no stored
  // candidate preserved. Usually empty.
  //
  // THIS IS THE HALF OF THE RECEIPT `candidates` CANNOT CARRY. A candidate marked
  // `preserves_structure` says what a stored fact kept; nothing in that list can
  // say anything about a table that produced no candidate at all, or that produced
  // only a description of itself. A caller who submitted a schedule and read back
  // two stored facts had no way to learn the schedule was not one of them.
  //
  // COMPUTED BY SUBTRACTION, never from the model reporting its own omission.
  // The platform scans each turn for structures before the model is called, and a
  // structure in a turn that no verified preserving candidate came from is listed
  // here. Asking an extractor to volunteer what it failed to keep is asking a model
  // to notice its own absence, which is the least reliable thing a model does.
  repeated SummarizedStructure summarized_structures = 13;
}
