syntax = "proto3";

package jennahapi.datastore.v1;

import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/alphauslabs/jennah-api/datastore";

// DataService is the structured row transport for a dataset's application tables.
service DataService {
  // Applies a set of structured row operations across one or more of the
  // dataset's tables in a SINGLE read-write transaction, clamped to
  // `(EnterpriseId, DatasetId)`. All-or-nothing: if any operation fails, no
  // operation's rows are written.
  //
  // This is the atomic multi-table write a split stack cannot offer: a row, its
  // embedding, and rows in other tables land together or not at all. An
  // operation naming a table absent from the dataset's catalog rejects the whole
  // commit, writing nothing.
  //
  // An operation may also make its OWN effect a precondition of the commit (see
  // RowOperation.expect), which is what makes compare-and-set expressible. An
  // unmet precondition returns FAILED_PRECONDITION and writes nothing; the
  // status carries a google.rpc.PreconditionFailure naming the operation, its
  // table, and the expected and observed counts, so it is distinguishable from
  // a rejected truncation, which reports the same code. Never retry it blindly:
  // re-read the contended row and decide again.
  //
  // A commit whose response is LOST is recoverable only if it carried an
  // idempotency_key: resending it with the same key applies nothing a second
  // time and returns the original commit's receipt. Without a key there is no
  // way to ask whether a commit landed, and no way to say "this is the same one
  // I already sent". See CommitDataRequest.idempotency_key.
  //
  // Requires datastore.data:write and a dataset selector matching dataset_id.
  rpc CommitData(CommitDataRequest) returns (CommitDataResponse) {
    option (google.api.http) = {
      post: "/v1/datasets/{dataset_id}/data:commit"
      body: "*"
    };
  }

  // Evaluates a multi-section read against ONE read snapshot, so a relational
  // predicate and a vector ranking observe the same instant: an optional
  // relational section and an optional exact-KNN vector section. Every section
  // is clamped to the caller's `(EnterpriseId, DatasetId)` slice, and joins are
  // restricted to tables within the same dataset.
  //
  // The request is a SECTIONED ENVELOPE for the same reason QueryMemory is: a
  // flat relational-shaped request would make adding a further modality a
  // breaking change to a published endpoint. A graph section is the intended
  // third.
  //
  // Requires datastore.data:read and a dataset selector matching dataset_id.
  rpc QueryData(QueryDataRequest) returns (QueryDataResponse) {
    option (google.api.http) = {
      post: "/v1/datasets/{dataset_id}/data:query"
      body: "*"
    };
  }
}

// ---------------------------------------------------------------------------
// Values
// ---------------------------------------------------------------------------

// One typed column value.
//
// Values are explicitly typed rather than carried as free-form JSON because
// application columns are real typed columns: routing an INT64 through a
// JSON number silently loses precision past 2^53, and TIMESTAMP, DATE, and BYTES
// have no faithful JSON scalar at all. A money column or an id that quietly
// changes value in transit is exactly the failure this shape exists to prevent.
message Value {
  oneof kind {
    // Explicit SQL NULL. Distinct from an ABSENT column: absent means "leave
    // this column alone" on an update and "use the column default" on an
    // insert, while null_value writes NULL.
    bool null_value = 1;
    string string_value = 2;
    // Serialized as a JSON string over the REST gateway (proto3 JSON mapping),
    // so full 64-bit range survives the round trip.
    int64 int64_value = 3;
    double float64_value = 4;
    bool bool_value = 5;
    google.protobuf.Timestamp timestamp_value = 6;
    string date_value = 7; // ISO-8601 calendar date, "YYYY-MM-DD"
    bytes bytes_value = 8;
    string json_value = 9; // serialized JSON document, for a COLUMN_TYPE_JSON column
    VectorValue vector_value = 10;
  }
}

// A fixed-width embedding. Its length must equal the target column's declared
// `dimensions`; a mismatch is refused rather than padded or truncated.
// Single-precision (32-bit) because that is the precision vectors are stored at;
// sending double would be silently narrowed.
message VectorValue {
  repeated float values = 1;
}

// One row: logical column name -> value. A column absent from the map is not
// written (see Value.null_value for the difference from an explicit NULL).
message Row {
  map<string, Value> columns = 1;
}

// ---------------------------------------------------------------------------
// Predicates
// ---------------------------------------------------------------------------

// One predicate over a column.
//
// The operator set is deliberately IDENTICAL to the memory plane's metadata
// filter grammar, including what it leaves out: there is no inequality operator
// and no disjunction between predicates, both of which were considered and cut
// there rather than overlooked. Predicates combine conjunctively: all must
// match. Reproducing that set exactly is the point: two predicate languages on
// one platform is how a filter that means subtly different things in two places
// eventually gets written.
//
// ONE SEMANTIC DIFFERENCE, and it is deliberate. Metadata comparison is
// LEXICOGRAPHIC, because a metadata value is an untyped string and the platform
// refuses to guess a type for it. An application column HAS a declared type, so
// comparison here is TYPED and natural: an INT64 column orders numerically
// (10 > 9), a TIMESTAMP column chronologically. The metadata plane's
// zero-pad-your-numbers advice does not apply and must not be carried over.
//
// A row whose column is NULL matches NO operator, including OPERATOR_EQUALS:
// there is no value to compare or order against, so a NULL excludes. This
// matches the metadata plane's absent-key rule.
message Predicate {
  // How `value` is compared against the row's stored value for `column`. Each
  // reads "the row's stored value <op> `value`". A bounded range is two
  // predicates on the same column.
  enum Operator {
    OPERATOR_UNSPECIFIED = 0; // treated as EQUALS
    OPERATOR_EQUALS = 1;
    OPERATOR_LESS_THAN = 2;
    OPERATOR_LESS_THAN_OR_EQUAL = 3;
    OPERATOR_GREATER_THAN = 4;
    OPERATOR_GREATER_THAN_OR_EQUAL = 5;
  }

  // Logical column name, resolved through the dataset catalog. A name the
  // catalog does not hold is NOT_FOUND; it is never interpolated.
  string column = 1;
  Operator operator = 2;
  // Bound as a query parameter, never interpolated. Its type must match the
  // column's declared type.
  Value value = 3;
}

// ---------------------------------------------------------------------------
// Commit
// ---------------------------------------------------------------------------

// What a row operation does.
enum OperationType {
  OPERATION_TYPE_UNSPECIFIED = 0;
  // Fails if a row with the same primary key already exists.
  OPERATION_TYPE_INSERT = 1;
  // Writes the row when its primary key is new, and otherwise overwrites the
  // columns named in `row` on the row already there.
  //
  // An upsert MERGES on the key rather than replacing the row: a column the
  // operation does not name keeps the value it had, so upserting
  // {customer_id, email} over a row that also carries `phone` leaves `phone`
  // intact. Name a column with a null value to clear it.
  OPERATION_TYPE_UPSERT = 2;
  // Sets the columns present in `row` on rows matching `where`.
  //
  // Matching NO row is not an error: the operation is a no-op and the receipt
  // reports zero rows for the table. Read the receipt's row count when the
  // difference matters, rather than treating a successful commit as proof a row
  // was there to update, or set `expect` to make the count a precondition of
  // the commit, which refuses it before anything is written.
  OPERATION_TYPE_UPDATE = 3;
  // Deletes rows matching `where`.
  //
  // Matching no row is likewise not an error. Set `expect.at_least_one` for
  // delete-if-exists.
  OPERATION_TYPE_DELETE = 4;
}

// One structured row operation.
message RowOperation {
  // Logical table name, resolved through the dataset catalog. A table the
  // catalog does not hold rejects the whole commit.
  string table = 1;
  OperationType type = 2;

  // Column values for INSERT, UPSERT, and UPDATE. Ignored for DELETE.
  //
  // INSERT and UPSERT address the row by key, so both must name EVERY
  // primary-key column; a partial key is a typed error rather than a write to
  // some other row. UPDATE addresses rows through `where` instead and needs at
  // least one column to set.
  //
  // A vector column's value is supplied here like any other, as a
  // VectorValue, and its ABSENCE is meaningful. When the column declares a
  // source column, an absent vector is GENERATED server-side from that column's
  // content, inline in the same statement as the row write, so the row and its
  // embedding are never separately visible. When the column declares no source
  // column, an absent vector is a typed error: it is never silently generated
  // and never written as NULL.
  //
  // A SUPPLIED vector is stored exactly as given and the model is not invoked,
  // so a caller may use its own embedding model provided the width matches. The
  // platform can dimension-check a supplied vector but cannot verify which model
  // produced it, as is already true of the memory plane.
  Row row = 3;

  // Row selector for UPDATE and DELETE, combined conjunctively with the
  // dataset clamp (which is injected and cannot be omitted or widened). Ignored
  // for INSERT and UPSERT.
  //
  // An UPDATE or DELETE with no predicates affects every row of the table
  // WITHIN THE DATASET SLICE. That is permitted and bounded, but it is rarely
  // what a caller means, so state the key explicitly unless a full-table
  // operation is intended.
  repeated Predicate where = 4;

  // A precondition on THIS operation's own effect. When set and not met, the
  // WHOLE commit is refused and no row from any table in it is written: the
  // same consequence a table absent from the catalog already carries, not a
  // per-operation skip.
  //
  // This is what makes compare-and-set, delete-if-exists, and assert-absence
  // expressible. Without it a commit is atomic but unconditional: an UPDATE
  // whose predicate matches nothing is a silent no-op that still lets every
  // other operation land, so an audit row can be persisted beside a state
  // change that never happened.
  //
  // Valid on UPDATE and DELETE only. On INSERT and UPSERT it is refused as an
  // invalid argument rather than ignored, because a mutation's affected count
  // is a prediction the transaction never checks: an expectation over it would
  // attest to something no one measured. Insert-if-absent needs no expectation:
  // a duplicate primary key already refuses the whole commit.
  //
  // A caller looping on failure OWNS ITS OWN BACKOFF. An
  // optimistic-concurrency loop that re-reads and retries immediately will spin
  // under contention; the platform does not retry a failed precondition, and
  // must not, because a blind replay either fails identically or succeeds
  // against a state the caller never evaluated.
  RowExpectation expect = 5;
}

// A precondition on how many rows an operation affects.
//
// A message rather than a bare integer because proto3 scalars have no field
// presence: `0` would be indistinguishable from unset, and exactly-zero is one
// of the useful preconditions ("apply this only if nothing matches"). Leaving
// the field unset means no precondition, which is how every operation written
// before this field existed behaves.
message RowExpectation {
  oneof kind {
    // The operation must affect EXACTLY this many rows.
    //
    // Use this for a KEYED write, where the predicate names one row by primary
    // key and any other count means something the caller did not model:
    // `exactly: 1` is the compare-and-set. `exactly: 0` asserts absence: the
    // rows the predicate selects must not exist.
    //
    // Do not use it for a predicate that legitimately matches a number of rows
    // the caller cannot know in advance; `at_least_one` is that condition, and
    // an over-specified count reads back as a conflict that is not one.
    int64 exactly = 1;

    // The operation must affect ONE OR MORE rows, whatever the number.
    //
    // Use this for a PREDICATE-SELECTED write whose count is not known in
    // advance: "close every open session for this user, and fail if there were
    // none". Set to true to require it; false is not a condition and is treated
    // as no precondition at all.
    bool at_least_one = 2;
  }
}

// Request for DataService.CommitData.
message CommitDataRequest {
  string dataset_id = 1; // route path parameter; never read from the body

  // Operations to apply, in order, in one transaction. An empty list is a no-op
  // commit and is not an error.
  repeated RowOperation operations = 2;

  // When set, embedding truncation is FATAL to the whole commit instead of
  // merely reported: if the model truncates any embedding the SERVER generated,
  // the commit is rejected and no row from any table in it is written.
  //
  // Truncation policy belongs to the caller, exactly as it does on the memory
  // plane, and the same reasoning applies: an audit-trail writer may prefer a
  // degraded embedding over a lost commit, while a retrieval-critical writer
  // prefers to fail, split the content, and re-commit. Defaults to false, where
  // the receipt's `truncations` reports the same fact without refusing the
  // write.
  //
  // Rejection fires only on the model's OWN report of truncation, never on an
  // estimated token count, so a caller is never refused for content the model
  // would in fact have accepted. It never fires for a caller-supplied vector:
  // the platform embedded nothing there and has nothing to report about it.
  bool reject_on_truncation = 3;

  // An optional caller-chosen key making this commit SAFELY RESENDABLE. Where it
  // is set, the commit is applied AT MOST ONCE: a repeat of a key already
  // committed applies nothing and returns the ORIGINAL commit's receipt.
  //
  // THE RECOVERY IT EXISTS FOR. A commit that times out, or whose connection
  // drops, leaves the caller unable to tell whether it applied, and resending it
  // without a key is answered wrongly in a way that depends on what the commit
  // contained: an INSERT collides on its own earlier row, absolute UPDATEs apply
  // again and mint a second receipt, and a compare-and-set is refused with
  // FAILED_PRECONDITION because the first attempt already moved the row it
  // guarded. That last one reports failure for work that SUCCEEDED. So: on any
  // ambiguous failure, resend the identical request with the same key. Do not
  // read tables back to guess, and do not mint a new key.
  //
  // IT NAMES AN INTENT, NOT AN ATTEMPT. This is the one thing to get right, and
  // the natural reading is the wrong one. The key identifies the WORK the caller
  // wants done once, "charge invoice 4021", "apply ledger batch 88", not the
  // individual wire attempt. Every retry of that work, whether by an SDK's
  // automatic retry or by a caller's own loop, must reuse the SAME key; a new
  // logical operation gets a NEW one. A fresh key per attempt provides exactly
  // nothing: each attempt then looks like a separate intent, which is the
  // behavior of supplying no key at all.
  //
  // THE RECEIPT IS THE ORIGINAL'S. A repeat returns the first commit's commit
  // timestamp, its per-table counts, and its truncations, not a receipt
  // describing the resend. A timestamp of "now" would let a caller conclude a
  // write happened at a moment when nothing did, and would break any ordering
  // derived from commit timestamps. There is deliberately no "this was a replay"
  // flag: the honest answer to "was my intent carried out" is the receipt for the
  // commit that carried it out. A caller that must distinguish a replay can
  // compare the returned timestamp against its own attempt.
  //
  // REUSE WITH A DIFFERENT REQUEST IS REFUSED with INVALID_ARGUMENT, not answered
  // from the stored receipt. The platform fingerprints the request behind the key,
  // so presenting a spent key with different operations (a client bug, a
  // recycled counter) is an error rather than a plausible receipt for work that
  // was never requested. Mint a new key. Note the asymmetry: an IDENTICAL resend
  // is a success carrying the original receipt, a DIFFERENT one is an error, and
  // the two must not be confused.
  //
  // RETENTION IS BOUNDED, and the bound is part of this contract rather than an
  // implementation detail: a key is remembered for AT LEAST 24 hours after the
  // commit it names. Beyond that the record may be reclaimed and a resend applies
  // again as a new commit. It is a floor, not a window: a key may keep answering
  // for some time beyond it. So never treat a resend outside the window as safe,
  // and never depend on one becoming unsafe at a particular moment. Retry budgets
  // measured in seconds or minutes sit far inside it.
  //
  // Keys are scoped to the DATASET: the same key may be used independently in two
  // datasets, and the record does not survive the dataset's deletion. The key is
  // caller-chosen and opaque to the platform: a UUID or any other value unique
  // to the intent within the dataset. Leave it unset for the historical behavior,
  // where a resend is treated as a new commit.
  string idempotency_key = 4;
}

// One server-generated embedding the model truncated. The row was written (or,
// with reject_on_truncation, the commit was refused): the stored content is
// complete, the stored embedding is not, so the tail of the source column is
// unreachable by vector search.
message TruncationReport {
  string table = 1; // logical table name
  string column = 2; // logical vector column name
  // Primary-key values of the affected row, by logical column name, so a caller
  // knows exactly which row to split and re-commit. A count could not say that
  // in a multi-row commit.
  map<string, Value> primary_key = 3;
  // Tokens the model counted in the content it was GIVEN, not in the prefix it
  // embedded, so this EXCEEDS the model's input limit rather than equalling it.
  // Dividing it by the limit is roughly how many pieces the content needs
  // splitting into.
  int64 token_count = 4;
}

// The commit receipt: a commit timestamp plus what the atomic step persisted.
message CommitDataResponse {
  google.protobuf.Timestamp commit_timestamp = 1;
  // Rows affected per logical table name.
  map<string, int64> rows_by_table = 2;
  // Server-generated embeddings the model truncated. Empty means every
  // generated embedding in this commit was produced in full. Never populated for
  // a caller-supplied vector.
  repeated TruncationReport truncations = 3;
}

// ---------------------------------------------------------------------------
// Query
// ---------------------------------------------------------------------------

// How a join combines rows. Both sides must be tables in the SAME dataset:
// cross-dataset joins are not expressible, because each query is clamped to one
// dataset slice exactly as a memory query is clamped to one agent.
enum JoinType {
  JOIN_TYPE_UNSPECIFIED = 0; // treated as INNER
  JOIN_TYPE_INNER = 1;
  JOIN_TYPE_LEFT = 2;
}

// One join onto the relational section's root table.
message Join {
  string table = 1; // logical table name, within this dataset
  JoinType type = 2;
  // Equi-join condition: `left_column` on the previously-joined relation equals
  // `right_column` on `table`. Both resolve through the catalog; neither is
  // interpolated.
  string left_column = 3;
  string right_column = 4;
}

// Sort direction and column for a relational result.
message OrderBy {
  string column = 1; // logical column name
  bool descending = 2;
}

// Relational section: predicates, projection, joins, ordering, pagination.
message RelationalQuery {
  string table = 1; // logical root table name

  // Logical columns to return. Empty projects every column of every joined
  // table. A column named in more than one joined table must be disambiguated
  // as "table.column".
  repeated string select = 2;

  // Conjunctive predicates, combined with the injected dataset clamp.
  repeated Predicate where = 3;

  // Joins onto `table`, applied in order. Restricted to this dataset's
  // cataloged tables.
  repeated Join joins = 4;

  repeated OrderBy order_by = 5;

  // Max rows to return. When it exceeds the tier's ceiling the query is served
  // AT the ceiling rather than refused: asking for more rows than the plan
  // allows is served short, not rejected.
  int32 limit = 6;

  // Resume a walk of this section. Empty starts one. See
  // QueryDataResponse.next_page_token for the exhaustion contract. Opaque and
  // server-generated: a token the server cannot interpret is REJECTED with
  // INVALID_ARGUMENT rather than silently restarting, and a token can only
  // narrow within the caller's slice, never widen it.
  string page_token = 7;
}

// Vector section: exact-KNN ranking over one vector column.
//
// Ranking is by EXACT cosine distance, not an approximate index. Each query is
// already clamped to a dataset slice, which makes the scan small and an ANN
// index pointless: the same conclusion the memory plane reached.
message VectorQuery {
  string table = 1; // logical table name
  string column = 2; // logical COLUMN_TYPE_VECTOR column to rank by

  // Query vector. Its width must equal the column's declared `dimensions`; a
  // mismatch is refused, which is what makes a later re-embed detectable rather
  // than silently returning nonsense.
  VectorValue embedding = 3;

  // Text to embed server-side as the query vector, as an alternative to
  // `embedding`. Requires the target column to declare a source column: the
  // platform will not guess which model to embed a query with for a column whose
  // vectors it did not produce. Exactly one of `embedding` or `query_text` must
  // be supplied.
  string query_text = 4;

  // Logical columns to return alongside the distance. Empty projects every
  // column of the table except the vector column itself, which is large and
  // almost never wanted in a result.
  repeated string select = 5;

  // Conjunctive predicates narrowing the candidate set.
  //
  // These are evaluated in the WHERE clause BEFORE ranking, never as a
  // post-filter over an already-ranked or already-limited set. So the result is
  // the nearest `limit` rows AMONG those matching the predicates, not the
  // predicates applied to an unfiltered nearest-`limit` set, which would return
  // fewer rows (often zero) for reasons a caller could not predict. Same rule
  // the memory plane applies to metadata filters.
  repeated Predicate where = 6;

  // Max matches to return, clamped to the tier's ceiling like the relational
  // section's. A filtered section MAY return fewer when fewer rows match; that
  // is the caller's own narrowing and is reproducible from the predicates, not
  // the silent truncation the dataset clamp guarantees against.
  int32 limit = 7;
}

// Read staleness for the whole query. Absent means a STRONG, externally
// consistent read: the default, and the right one unless latency demands
// otherwise.
//
// A staleness bound is applied UNIFORMLY to every section, so sections can never
// observe different instants. Bounded staleness is what makes a multi-region
// dataset read at local latency without giving up its write geography.
message ReadStaleness {
  oneof mode {
    // Read at any timestamp at most this far in the past, letting the backend pick a
    // replica-local timestamp. The usual choice for a low-latency global read.
    google.protobuf.Duration max_staleness = 1;
    // Read at exactly this far in the past.
    google.protobuf.Duration exact_staleness = 2;
    // Read at this exact timestamp. Bounded by the backend's version-retention
    // window (about an hour); an older timestamp is refused.
    google.protobuf.Timestamp read_timestamp = 3;
  }
}

// Request for DataService.QueryData.
//
// Any subset of the section fields may be present; at least one SHOULD be. All
// present sections are evaluated at ONE read timestamp.
message QueryDataRequest {
  string dataset_id = 1; // route path parameter; never read from the body

  // Relational section. Absent to skip it.
  RelationalQuery relational = 2;
  // Exact-KNN vector section. Absent to skip it.
  VectorQuery vector = 3;

  // Optional read staleness, applied uniformly to every section. Absent reads
  // strongly.
  ReadStaleness staleness = 4;
}

// Relational section result.
message RelationalResult {
  repeated Row rows = 1;
}

// One vector-section match: the projected row plus its distance from the query
// vector.
message VectorMatch {
  Row row = 1;
  double distance = 2; // cosine distance; smaller is closer
}

// Vector section result, ordered by ascending distance.
message VectorResult {
  repeated VectorMatch matches = 1;
}

// Response for DataService.QueryData. Each result section is present only when
// its corresponding request section was supplied.
message QueryDataResponse {
  RelationalResult relational = 1;
  VectorResult vector = 2;

  // The single read timestamp every section was evaluated at.
  google.protobuf.Timestamp read_timestamp = 3;

  // Continuation token for the RELATIONAL section. An EMPTY token means the
  // listing is EXHAUSTED, not merely that this page ended, so a caller can
  // tell "this is every matching row" from "this is the first page of an unknown
  // amount". Feed it back as RelationalQuery.page_token.
  //
  // The vector section has no continuation: it is a top-`limit` ranking, not an
  // enumerable listing, so there is nothing to resume. Asking for more nearest
  // neighbours means raising `limit`, not paging.
  //
  // CONSISTENCY: pages are independently snapshotted, so a commit landing
  // mid-walk may appear. Set the same `staleness.read_timestamp` on every
  // request of the walk for a stable view.
  string next_page_token = 4;
}
