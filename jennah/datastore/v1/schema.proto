syntax = "proto3";

package jennahapi.datastore.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/alphauslabs/jennah-api/datastore";

// SchemaService is the tenant-facing schema catalog for a dataset's
// user-defined tables.
//
// Tenants declare LOGICAL tables and columns. The control plane validates each
// declaration against a strict grammar, mints a PHYSICAL identifier for every
// object, records the logical->physical mapping in the catalog, and creates real
// tables. Callers only ever name logical identifiers; a caller string never
// reaches query text. A logical name absent from the dataset's catalog is a
// not-found, never a fallthrough to raw interpolation — which is what makes
// identifier injection structurally impossible rather than merely filtered.
//
// Every table's primary key is led by `(EnterpriseId, DatasetId)`, prepended by
// the platform and NOT expressible in a declaration. That is what makes a
// dataset's rows a contiguous key range and isolation a mandatory bound
// predicate rather than a remembered WHERE clause.
service SchemaService {
  // Declares or evolves the dataset's tables. Idempotent and ADDITIVE:
  // re-declaring an existing table or column is a no-op, and a new column is
  // added as an online change. Destructive changes (dropping a table or column,
  // or retyping one) are REJECTED in this version — they can rewrite or lose
  // live tenant data, and deserve an explicit, separately-authorized migration
  // path rather than being reachable from the ordinary declare call.
  //
  // Validation happens entirely before any DDL is issued, so a rejected
  // declaration leaves the schema untouched — including when it is refused for
  // exceeding a dataset's table, column, or index ceiling, which returns
  // RESOURCE_EXHAUSTED and never a raw backend error.
  //
  // Schema changes are applied asynchronously, so an accepted declaration
  // returns with each table at SCHEMA_STATUS_PENDING; poll GetSchema until every
  // table reaches SCHEMA_STATUS_READY before committing data to it.
  //
  // Requires datastore.schema:manage, which is deliberately NOT part of the
  // built-in member role: declaring a table issues DDL against a shared
  // data-plane database, so it is always an explicit grant to a custom role or
  // an explicitly scoped key. It IS grantable to an API key — a machine
  // principal building an app has to be able to declare its own tables.
  rpc DeclareTables(DeclareTablesRequest) returns (DeclareTablesResponse) {
    option (google.api.http) = {
      post: "/v1/datasets/{dataset_id}/schema:declare"
      body: "*"
    };
  }

  // Reads the dataset's logical schema: every declared table with its columns,
  // indexes, vector modality, and current apply status, plus usage against the
  // tier's ceilings. This is the poll surface for a declaration still applying.
  // Requires datastore.schema:read.
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse) {
    option (google.api.http) = {get: "/v1/datasets/{dataset_id}/schema"};
  }
}

// Apply state of a declared table.
enum SchemaStatus {
  SCHEMA_STATUS_UNSPECIFIED = 0;
  // The physical table exists and matches the declaration; data may be
  // committed to it.
  SCHEMA_STATUS_READY = 1;
  // The change has been accepted and is applying. Schema changes are
  // queued and can take time, so this is the normal state immediately after a
  // declaration, not an error.
  SCHEMA_STATUS_PENDING = 2;
  // The DDL failed to apply; status_detail carries the reason.
  SCHEMA_STATUS_FAILED = 3;
}

// The type of a declared column. These map to real storage types; the mapping is
// the platform's, so a tenant never writes a backend type name.
enum ColumnType {
  COLUMN_TYPE_UNSPECIFIED = 0;
  COLUMN_TYPE_STRING = 1;
  COLUMN_TYPE_INT64 = 2;
  COLUMN_TYPE_FLOAT64 = 3;
  COLUMN_TYPE_BOOL = 4;
  COLUMN_TYPE_TIMESTAMP = 5;
  COLUMN_TYPE_DATE = 6;
  COLUMN_TYPE_BYTES = 7;
  COLUMN_TYPE_JSON = 8;
  // A fixed-width embedding column, searchable by exact COSINE_DISTANCE as a
  // section of DataService.QueryData. Requires `vector` to be set.
  COLUMN_TYPE_VECTOR = 9;
}

// Options for a COLUMN_TYPE_VECTOR column.
message VectorOptions {
  // Vector width. Every value written to this column — caller-supplied or
  // server-generated — must have exactly this many elements, and so must a query
  // vector ranked against it. A width mismatch is refused rather than padded or
  // truncated.
  int32 dimensions = 1;

  // Optional name of a string column ON THE SAME TABLE whose content the
  // platform embeds to produce this vector. Setting it opts the column into
  // SERVER-SIDE GENERATION; leaving it empty makes the column caller-supplied
  // only.
  //
  // This is the whole of the opt-in, and the two paths differ sharply:
  //
  //   source_column SET    — a row committed without this vector has it
  //                          generated from source_column in the same
  //                          transaction as the row. A row that DOES supply a
  //                          vector still stores exactly what was supplied; the
  //                          model is not invoked.
  //   source_column UNSET  — a row committed without this vector is a typed
  //                          error. It is never silently generated, and never
  //                          written as NULL: a column declared to hold an
  //                          embedding that silently holds nothing is invisible
  //                          to search for a reason the caller cannot see.
  //
  // Validated at declare time: the named column must exist on this table, must
  // be COLUMN_TYPE_STRING, and must not be the vector column itself. A bad
  // source column is rejected with INVALID_ARGUMENT and issues no DDL.
  //
  // Declaring a source column also causes the platform to mint two managed
  // truncation columns on this table (see ColumnSchema.managed). They consume
  // the table's column budget, which is deliberate: the cost belongs to the
  // table that opted into managed embedding rather than to every table.
  string source_column = 2;

  // Output-only. The embedding generation this column's stored vectors were
  // produced under, assigned by the platform when the column is declared. It is
  // recorded so a later re-embed is scopable and reversible — you can tell which
  // vectors came from which model without re-deriving it from write timestamps.
  // Empty for a caller-supplied-only column, where the platform embedded nothing
  // and can attest to nothing.
  string embedding_generation = 3;
}

// One column in a table declaration.
message ColumnDeclaration {
  // Logical column name, validated against a strict grammar (charset, length,
  // reserved-word denylist) before it is accepted. The platform mints the
  // physical identifier; this name never reaches query text.
  string name = 1;
  ColumnType type = 2;
  // When false the column is NOT NULL. Adding a NOT NULL column to a table that
  // already holds rows is rejected, since existing rows would have no value for
  // it.
  bool nullable = 3;
  // Required when type is COLUMN_TYPE_VECTOR, ignored otherwise.
  VectorOptions vector = 4;
}

// One secondary index in a table declaration.
message IndexDeclaration {
  string name = 1; // logical index name, validated like a column name
  repeated string columns = 2; // logical column names, in index key order
  bool unique = 3;
  // Uniqueness is enforced WITHIN the dataset slice, never across the shared
  // data-plane database: the platform prepends the clamp columns to the index
  // key, so two datasets may each hold a row with the same value.
}

// One table in a declaration.
message TableDeclaration {
  // Logical table name, validated against a strict grammar before acceptance.
  string name = 1;
  repeated ColumnDeclaration columns = 2;

  // Logical column names forming the table's primary key, in order. The
  // platform PREPENDS `(EnterpriseId, DatasetId)` to whatever is named here —
  // that is not expressible in the declaration and cannot be overridden or
  // reordered, because it is what makes cross-slice access structurally
  // impossible rather than merely denied.
  repeated string primary_key = 3;

  repeated IndexDeclaration indexes = 4;

  // There is deliberately NO per-row authorization field here — no owner column
  // and no policy predicate.
  //
  // A per-row owner predicate is meaningful only when the END USER is a
  // principal, as it is in systems that mint a credential per application user.
  // Jennah principals are enterprise members (invite-based, seat-counted) and API
  // keys; an end user of a tenant's application is neither. A tenant's app calls
  // with ONE key, so `owner = caller` would resolve to the same principal for
  // every row and distinguish nothing.
  //
  // The dataset is the unit of isolation: every principal that reaches a dataset
  // reaches all of its rows. A per-row layer needs an END-USER IDENTITY that is
  // not a Jennah principal — a subject supplied by the tenant's own auth, carried
  // on the request and bound into the clamp — which is a larger design than a
  // policy language and is not part of this surface.
}

// Request message for the SchemaService.DeclareTables rpc.
message DeclareTablesRequest {
  string dataset_id = 1; // route path parameter; never read from the body
  // Tables to declare or evolve. The whole request is validated before any DDL
  // is issued, so a single bad table rejects the batch and changes nothing.
  repeated TableDeclaration tables = 2;
}

// Apply state of one table after a declaration.
message TableStatus {
  string name = 1; // logical table name
  SchemaStatus status = 2;
  // Human-readable detail for a PENDING or FAILED status. Empty for READY.
  string status_detail = 3;
}

// Response message for the SchemaService.DeclareTables rpc.
message DeclareTablesResponse {
  // One entry per declared table, in request order. A table whose declaration
  // was already satisfied comes back READY immediately (re-declaring is a
  // no-op); anything requiring DDL comes back PENDING.
  repeated TableStatus tables = 1;
}

// Request message for the SchemaService.GetSchema rpc.
message GetSchemaRequest {
  string dataset_id = 1; // path parameter
}

// One column as stored in the catalog.
message ColumnSchema {
  string name = 1; // logical name
  ColumnType type = 2;
  bool nullable = 3;
  VectorOptions vector = 4; // set for a vector column

  // True for a column the PLATFORM added rather than the tenant: today, the two
  // truncation columns that accompany a managed vector column (whether the
  // stored embedding was truncated, and how many tokens the model counted in the
  // content it was given).
  //
  // A managed column is readable and returned by queries like any other, but it
  // cannot be declared, altered, or written by a caller — the platform maintains
  // it in the same transaction as the row it describes. It counts against the
  // table's column ceiling.
  bool managed = 5;
}

// One table as stored in the catalog.
message TableSchema {
  string name = 1; // logical name
  repeated ColumnSchema columns = 2;
  // Logical primary-key columns AS DECLARED — the `(EnterpriseId, DatasetId)`
  // prefix the platform prepends is not listed, because it is not a tenant
  // concept and naming it here would imply it were optional.
  repeated string primary_key = 3;
  repeated IndexDeclaration indexes = 4;
  SchemaStatus status = 5;
  string status_detail = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8; // last successful schema change
}

// A dataset's usage against its tier's schema ceilings, so a caller can see how
// much room is left before a declaration is refused rather than discovering the
// ceiling by hitting it.
//
// A limit of -1 means unlimited. A limit currently in report-only rollout is
// reported here with its real value but does not refuse a declaration; the
// response cannot distinguish the two, deliberately — a caller should build
// against the published ceiling regardless of whether it is being enforced yet.
message SchemaUsage {
  int64 tables = 1;
  int64 max_tables = 2;
  int64 indexes = 3;
  int64 max_indexes = 4;
  // The per-table column ceiling; compare against each TableSchema's column
  // count. Managed columns are included in that count.
  int64 max_columns_per_table = 5;
}

// Response message for the SchemaService.GetSchema rpc.
message GetSchemaResponse {
  repeated TableSchema tables = 1; // ordered by logical name
  SchemaUsage usage = 2;
}
