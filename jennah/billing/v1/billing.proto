syntax = "proto3";

package jennahapi.billing.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/alphauslabs/jennah-api/billing";

// BillingService is the provider-neutral billing surface for an enterprise.
service BillingService {
  // Reads the caller's active enterprise billing state: its effective tier, which
  // source owns that tier, and every subscription bound to it (plural because
  // one AWS account can hold several concurrent agreements for the same
  // product). External (gateway) RPC. Authenticated.
  //
  // It stays callable when the caller's tier is unusable (an expired trial or a
  // cancelled subscription): it is on the entitlement interceptor's exempt
  // allowlist, because a blocked customer must be able to reach the state that
  // explains how to recover.
  //
  // When `externally_managed` is true the client MUST NOT offer an in-app plan
  // change. Send the user to `manage_url` instead.
  rpc GetBillingState(GetBillingStateRequest) returns (GetBillingStateResponse) {
    option (google.api.http) = {get: "/v1/billing"};
  }

  // Reads the active enterprise's recorded formation token usage as aggregated
  // buckets, never as individual formation records. External (gateway) RPC.
  // Authenticated, and gated on `billing.usage:read`, which the built-in member
  // role does NOT carry. Tokens only: no price, cost or currency is returned.
  //
  // Grouping by scope, or filtering on a scope, additionally requires reach over
  // every agent workspace AND every subject scope in the enterprise (blanket reach
  // in both selector namespaces). Without it the request is refused with
  // PERMISSION_DENIED; there is no partial, reach-filtered answer, so a per-scope
  // breakdown always adds up to the enterprise's totals.
  //
  // Answered whether or not the deployment has a billing integration configured,
  // unlike the other methods here: token usage is recorded without one.
  //
  // Rejections (INVALID_ARGUMENT): a missing start_time, an end_time not after
  // start_time, a start_time earlier than the 400-day retention period, an unknown
  // time_zone, a malformed caller filter, or a result larger than the published
  // bucket maximum (narrow the range, coarsen the grain, or add a filter). None is
  // answered with a trimmed result.
  rpc GetFormationTokenUsage(GetFormationTokenUsageRequest) returns (GetFormationTokenUsageResponse) {
    option (google.api.http) = {get: "/v1/billing/usage/formation-tokens"};
  }

  // Binds the subscription behind a single-use registration handle to the caller's
  // active enterprise and applies its resolved tier. External (gateway) RPC.
  // Authenticated AND gated to ROLE_ROOT/ROLE_ADMIN on the active enterprise,
  // checked against the caller's current role, so a role change applies at once.
  // Also on the entitlement exempt allowlist, since this is the call that
  // restores a blocked caller's access.
  //
  // The handle is a bearer capability with a deliberately small blast radius:
  // whoever presents it attaches that subscription to THEIR active enterprise.
  //
  // Binding the same subscription to the same enterprise again is idempotent
  // success: buyers re-enter through AWS's "Set up your account" button routinely.
  //
  // Rejections. Each carries a `google.rpc.ErrorInfo` whose `domain` is
  // "jennah.alphaus.cloud" and whose `reason` is the constant named below. Key on
  // the reason, never on the human-readable message: each reason needs a
  // different recovery path in the UI.
  //   FAILED_PRECONDITION / REGISTRATION_HANDLE_INVALID: expired, already
  //     consumed, or unknown. Not distinguished from one another on purpose, so a
  //     caller cannot probe which handles exist.
  //   ALREADY_EXISTS / SUBSCRIPTION_BOUND_ELSEWHERE: bound to a different
  //     enterprise. The existing binding is NOT moved; recovery is an operator
  //     action with a recorded reason.
  //   PERMISSION_DENIED / ENTERPRISE_ADMIN_REQUIRED: the caller is a member
  //     without an administrator role on the active enterprise.
  //   FAILED_PRECONDITION / BILLING_SOURCE_CONFLICT: the enterprise's tier is
  //     already owned by a DIFFERENT billing source. (A second subscription from
  //     the SAME source is accepted, not refused.)
  rpc BindMarketplaceRegistration(BindMarketplaceRegistrationRequest) returns (BindMarketplaceRegistrationResponse) {
    option (google.api.http) = {
      post: "/v1/billing/aws:bind"
      body: "*"
    };
  }

  // Sets the active enterprise's formation overage multiple: how far past its
  // monthly formation allowance a billable enterprise may form, as a multiple of
  // its tier's overage unit band (see `overage_unit_band` on
  // GetBillingStateResponse). External (gateway) RPC. Units only: no price is
  // taken or returned.
  //
  // Only a signed-in user holding ROLE_ROOT or ROLE_ADMIN on the active
  // enterprise can call it, checked against the caller's current role. It is not
  // grantable by any permission, and an API key is refused before any role is
  // resolved, including a key created by an administrator, so an agent can never
  // raise its own spending limit.
  //
  // The multiple applies to the next formation admitted, for the current month.
  // Lowering it below what the month has used refuses the next formation and does
  // not reverse overage already used. An enterprise that is not billable may still
  // store a multiple; it applies once the enterprise is billable.
  //
  // Rejections:
  //   INVALID_ARGUMENT: the multiple is outside 0 to 10, or not a multiple of 0.5.
  //   PERMISSION_DENIED / ENTERPRISE_ADMIN_REQUIRED: the caller is a member
  //     without an administrator role, or is an API key. Carries a
  //     `google.rpc.ErrorInfo` whose `domain` is "jennah.alphaus.cloud".
  rpc SetFormationOverageCap(SetFormationOverageCapRequest) returns (SetFormationOverageCapResponse) {
    option (google.api.http) = {
      put: "/v1/billing/formation-overage-cap"
      body: "*"
    };
  }

  // --- Internal provider-driven RPC (no HTTP annotation; proxy-to-backend only) ---

  // Exchanges an AWS Marketplace registration token for the buyer's marketplace
  // identity, persists the subscription in the unbound state, mints a single-use
  // binding handle, and returns the console URL to redirect the browser to.
  //
  // Unauthenticated (interceptor allowlist), because the caller is AWS rather than
  // a jennah user: AWS POSTs the buyer's browser to the public registration
  // endpoint with no cookie and no bearer credential, and the buyer may have no
  // jennah account at all. Exemption from bearer-token auth is not exemption from
  // authentication: this method authenticates its caller by exchanging the
  // provider-issued token with AWS, and rejects the request when that fails.
  //
  // The resolve-and-persist-before-login ordering is the point: the token is
  // short-lived and cannot survive an interactive signup, and the buyer is billed
  // from contract creation whether or not they ever finish registering. After this
  // returns, every remaining step is retryable and nothing is time-critical.
  //
  // Rejections, split so the edge can tell a retry from a dead end. Those naming
  // a reason below carry a `google.rpc.ErrorInfo` whose `domain` is
  // "jennah.alphaus.cloud" and whose `reason` is that constant; key on the
  // reason, never on the human-readable message. UNAVAILABLE and UNIMPLEMENTED
  // carry NO ErrorInfo; for those the status code is the whole signal.
  //   INVALID_ARGUMENT / REGISTRATION_TOKEN_INVALID: missing or malformed token,
  //     or one AWS refuses. Permanent; do not retry.
  //   FAILED_PRECONDITION / PRODUCT_CODE_NOT_CONFIGURED: the token resolved to a
  //     product code this deployment has no mapping for. Permanent, and no
  //     subscription record is written.
  //   UNAVAILABLE: AWS was unreachable or throttled. Retryable, and no handle is
  //     minted and no partial subscription is left behind. The purchase still
  //     reaches us independently as a marketplace notification, so no revenue is
  //     lost by a failed registration.
  //   UNIMPLEMENTED: the deployment has no billing configuration at all.
  rpc ResolveMarketplaceRegistration(ResolveMarketplaceRegistrationRequest) returns (ResolveMarketplaceRegistrationResponse);
}

// Which system owns an enterprise's tier. Ownership is exclusive: a write from a
// source that does not own the tier is rejected, which is what keeps two billing
// integrations from fighting over one enterprise.
//
// A client MUST NOT decide whether to show an in-app plan change by comparing
// against this enum: a source added after the client was built arrives as
// BILLING_SOURCE_UNSPECIFIED. Use `externally_managed`, which is computed
// server-side and stays correct across versions.
enum BillingSource {
  // Unknown to this client's proto version: treat as external if
  // `externally_managed` says so.
  BILLING_SOURCE_UNSPECIFIED = 0;
  // Nobody is billing this enterprise yet: a trial. Stored as empty rather than a
  // literal, and it is the state the first paid subscription acquires rather than
  // contends for.
  BILLING_SOURCE_PLATFORM = 1;
  // A human intervention through the operator CLI. A source like any other: it
  // must own the tier or take ownership explicitly, so a support fix is as
  // auditable as a provider event.
  BILLING_SOURCE_OPERATOR = 2;
  // AWS Marketplace.
  BILLING_SOURCE_AWS_MARKETPLACE = 3;
}

// Lifecycle of one external subscription. The two non-obvious states exist
// because an absence of entitlements is ambiguous and a presence we cannot
// interpret is not a cancellation.
enum SubscriptionState {
  SUBSCRIPTION_STATE_UNSPECIFIED = 0;
  // Resolved and persisted, but not yet attached to any enterprise. A normal,
  // persistent state: AWS bills from contract creation, so a buyer who abandons
  // registration still has a paid subscription that must not be lost.
  SUBSCRIPTION_STATE_UNBOUND = 1;
  // Bound to an enterprise with an active entitlement.
  SUBSCRIPTION_STATE_ACTIVE = 2;
  // An authoritative read returned no active entitlement, but the subscription is
  // still within the grace window of its last known expiration, where "renewing
  // right now" and "ended" are the same observation. The tier is held and the
  // subscription re-read; only an absence that outlasts the window cancels.
  SUBSCRIPTION_STATE_PENDING_VERIFICATION = 3;
  // Something needs a human: entitlements are present but none maps to a
  // configured tier, or the purchased quantity is greater than one. The tier is
  // left unchanged in both cases: a dimension we do not recognize must never be
  // read as a cancellation.
  SUBSCRIPTION_STATE_NEEDS_ATTENTION = 4;
  // The subscription ended: either an explicit end event from the provider, or an
  // absence confirmed past the grace window.
  SUBSCRIPTION_STATE_CANCELLED = 5;
}

// One subscription bound to an enterprise. The field names are provider-neutral
// so a second billing source needs no second message; each comment names the AWS
// Marketplace meaning.
message BoundSubscription {
  BillingSource source = 1;

  // The provider's subscription identity. For AWS Marketplace this is the
  // agreement's LicenseArn: the identity used in logs, operator subcommands, and
  // support conversations. It is the agreement, not the buyer: one AWS account can
  // hold several concurrent agreements for the same product.
  string subscription_id = 2;

  // A provider-side account identifier the buyer can actually recognize. For AWS
  // Marketplace this is the buyer's AWS account id, which is what makes a support
  // claim ("that's my company's account") verifiable against a recorded fact.
  string account_ref = 3;

  // The provider-side product identifier this subscription was resolved under. For
  // AWS Marketplace this is the product code, and it selects which configured
  // dimension mapping applies: a second listing is a second product code.
  string product_ref = 4;

  // The tier resolved for THIS subscription. An enterprise holding several active
  // subscriptions is entitled at the highest-ranked tier across them, which is
  // reported as `tier` on GetBillingStateResponse.
  string tier = 5;

  // Last known entitlement expiration. For a monthly contract this advances on
  // every renewal, so it is a boundary every customer crosses each cycle rather
  // than a once-a-year event.
  google.protobuf.Timestamp expires_at = 6;

  SubscriptionState state = 7;

  // The purchased entitlement quantity. Recorded and surfaced but NOT enforced
  // (seat limits are out of scope), and it never affects the resolved tier.
  int64 quantity = 8;
}

// Request message for the BillingService.GetBillingState rpc.
message GetBillingStateRequest {}

// Response message for the BillingService.GetBillingState rpc.
message GetBillingStateResponse {
  // The active enterprise's effective tier: the highest-ranked tier across its
  // active subscriptions, or its platform-assigned tier when nothing is bound.
  string tier = 1;

  // The source that owns the tier, for display.
  BillingSource source = 2;

  // The raw owning-source identifier as stored, empty for a platform-owned (trial)
  // enterprise. Present so a source newer than the client's proto version is still
  // nameable in a support conversation and in logs.
  string source_id = 3;

  // True when the tier is owned by an external billing source. This is the field a
  // client switches on: when it is true, suppress every in-app plan-change
  // affordance and direct the user to `manage_url`. Computed server-side so it
  // stays correct for a source the client does not know about.
  bool externally_managed = 4;

  // Every subscription bound to the active enterprise. Plural because concurrent
  // agreements are legitimate: a second team buying separately, an early
  // re-purchase, or a channel-partner offer alongside a direct one. Empty for a
  // trial enterprise.
  repeated BoundSubscription subscriptions = 5;

  // Where the plan is managed when it is externally owned: the AWS Marketplace
  // subscription page for a marketplace-owned enterprise. Also the renewal path
  // shown when the tier is the terminal cancelled one, so a former subscriber gets
  // a re-subscribe link rather than an expired-trial prompt. Empty when the plan is
  // platform-owned.
  string manage_url = 6;

  // The formation fields below report the current formation window (the UTC
  // calendar month on a paid tier) in formation units only. No price or currency
  // amount is computed or returned.

  // The tier's formation allowance for the window, in units. Unbounded on a tier
  // with no formation ceiling, reported as -1.
  int64 formation_units_allowance = 7;

  // Formation units used in the window so far.
  int64 formation_units_used = 8;

  // Units used above the allowance this window. Zero when the enterprise is not
  // billable, since a non-billable enterprise is refused at its allowance.
  int64 formation_overage_units = 9;

  // The enterprise's overage multiple: the stored value, or the default of 2 when
  // none was set. Reported whether or not the enterprise is billable. Only a
  // signed-in root or administrator can change it (SetFormationOverageCap).
  double overage_multiple = 10;

  // The overage band in units: `overage_multiple` times the tier's unit band, the
  // number of overage units whose price equals one month of the tier's fee,
  // rounded down. A billable enterprise is refused once the window's units reach
  // `formation_units_allowance` plus this band. Zero on a tier with no overage.
  int64 overage_unit_band = 11;

  // True when formations past the allowance are admitted into the overage band
  // and billed: the enterprise holds an active subscription on a product with a
  // consumption dimension, on a tier that offers overage.
  bool overage_billable = 12;
}

// Request message for the BillingService.SetFormationOverageCap rpc.
message SetFormationOverageCapRequest {
  // The new multiple, from 0 to 10 in steps of 0.5. Zero means no overage: a
  // billable enterprise is refused at its allowance.
  double overage_multiple = 1;
}

// Response message for the BillingService.SetFormationOverageCap rpc.
message SetFormationOverageCapResponse {
  // The multiple as stored.
  double overage_multiple = 1;
}

// Request message for the BillingService.BindMarketplaceRegistration rpc.
message BindMarketplaceRegistrationRequest {
  // The single-use handle carried on the redirect from the public registration
  // endpoint. Short-lived, consumed on the first successful bind, and stored only
  // as a hash so a database read cannot recover a usable handle.
  string handle = 1;
}

// Response message for the BillingService.BindMarketplaceRegistration rpc.
message BindMarketplaceRegistrationResponse {
  // The subscription as bound, so the console can render the resulting plan
  // without a second call.
  BoundSubscription subscription = 1;

  // The enterprise's effective tier after the bind.
  string tier = 2;

  // True when this bind actually moved the tier. A tier change invalidates the
  // enterprise's outstanding access tokens.
  //
  // NOT always true. Re-binding a subscription already attached to the same
  // enterprise is idempotent success and changes nothing, so no refresh is needed;
  // buyers re-enter through the provider's "set up your account" link routinely.
  bool access_token_refresh_required = 3;
}

// Request message for the BillingService.ResolveMarketplaceRegistration rpc.
message ResolveMarketplaceRegistrationRequest {
  // The `x-amzn-marketplace-token` form field, verbatim as AWS posted it.
  string registration_token = 1;
}

// Response message for the BillingService.ResolveMarketplaceRegistration rpc.
message ResolveMarketplaceRegistrationResponse {
  // The absolute console URL to redirect the browser to, with the single-use
  // binding handle already embedded. The backend builds it, because the backend is
  // what holds the configured console origin and validates it against the app-
  // redirect allowlist; the edge only issues the 302.
  //
  // The handle is deliberately NOT returned as a separate field. It is a bearer
  // capability, and there is no consumer for it apart from this URL.
  string redirect_url = 1;
}

// Calendar period a token usage bucket covers, evaluated in the request's
// time_zone.
enum TokenUsageGrain {
  // No grain: the whole range is one period.
  TOKEN_USAGE_GRAIN_UNSPECIFIED = 0;
  // A calendar date.
  TOKEN_USAGE_GRAIN_DAY = 1;
  // An ISO week, beginning on Monday. A week can straddle two months or years.
  TOKEN_USAGE_GRAIN_WEEK = 2;
  // A calendar month.
  TOKEN_USAGE_GRAIN_MONTH = 3;
}

// The one dimension token usage may be grouped by.
enum TokenUsageDimension {
  // No grouping: one bucket per period.
  TOKEN_USAGE_DIMENSION_UNSPECIFIED = 0;
  // The scope the formation wrote to. Requires blanket reach (see the RPC).
  TOKEN_USAGE_DIMENSION_SCOPE = 1;
  // The credential that requested the formation, as "user:<user id>" or
  // "api_key:<key id>". An API key is the key itself, never its creator.
  TOKEN_USAGE_DIMENSION_CALLER = 2;
  // The model called, as configured for the region at the time.
  TOKEN_USAGE_DIMENSION_MODEL = 3;
  // The Jennah region that served the formation; empty when none was recorded.
  TOKEN_USAGE_DIMENSION_REGION = 4;
}

// Restricts which usage records are aggregated. Every set field must match. A
// filter does not imply a grouping.
message TokenUsageFilter {
  // Only this scope. Requires blanket reach (see the RPC).
  string scope_id = 1;
  // Only this caller: "user" or "api_key", set together with caller_id.
  string caller_kind = 2;
  string caller_id = 3;
  // Only this model.
  string model = 4;
  // Only this region.
  string region = 5;
}

message GetFormationTokenUsageRequest {
  // Start of the half-open range [start_time, end_time) over the time each
  // usage record was written. Required, and no earlier than 400 days ago.
  google.protobuf.Timestamp start_time = 1;
  // End of the range. Defaults to now; a later value is treated as now.
  google.protobuf.Timestamp end_time = 2;
  TokenUsageGrain grain = 3;
  TokenUsageDimension group_by = 4;
  // IANA time zone the grain's calendar periods are taken in, such as
  // "Asia/Tokyo". Defaults to "UTC".
  string time_zone = 5;
  // Nested, not flattened, on purpose: a top-level scope_id would be read by the
  // platform's per-scope access check, which would admit a caller reaching only
  // that scope. The scope rule for this read is blanket reach, applied by the
  // method itself.
  TokenUsageFilter filter = 6;
}

// One period's usage for one value of the grouping dimension.
message TokenUsageBucket {
  // The period's first calendar date in the request's time zone, as YYYY-MM-DD.
  // Empty when the request has no grain. A bucket at either end of the range
  // covers only the part of its period inside the range.
  string period_start = 1;
  // The grouping dimension's value. Empty when the request has no grouping.
  string key = 2;
  // Formations that reached the model in this bucket.
  int64 formations = 3;
  // Model-reported input and output tokens, summed. Kept apart because they are
  // priced differently. Output includes the model's reasoning tokens.
  int64 input_tokens = 4;
  int64 output_tokens = 5;
  // Formation units consumed by the formations in this bucket, summed per
  // formation: a formation's units are the larger of 1, its input tokens divided
  // by 16,384, and its output tokens divided by 8,192, each rounded up. Not
  // derivable from the bucket's token sums, because units are counted per
  // formation. A formation whose model calls reported no tokens counts toward the
  // formation ceiling but has no row here.
  int64 units = 6;
}

message GetFormationTokenUsageResponse {
  // Ordered by period_start, then key.
  repeated TokenUsageBucket buckets = 1;
  // The range and zone the buckets were computed under, after defaults.
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  string time_zone = 4;
}
