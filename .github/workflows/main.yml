---
name: main

# Every push and pull request generates and verifies every SDK. Only a version
# tag (v*) publishes, and it publishes every language at that version or none:
# publish runs only after verify has passed for every language. See
# release/README.md.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Generate all languages
      run: |
        mkdir -p $HOME/.local/bin
        curl -LO https://github.com/bufbuild/buf/releases/download/v1.71.0/buf-Linux-x86_64.tar.gz
        tar xvzf buf-Linux-x86_64.tar.gz
        cp buf/bin/* $HOME/.local/bin/
        export PATH="$PATH:$HOME/.local/bin:$(go env GOPATH)/bin"
        go install tool && buf dep update && buf generate

    - uses: actions/upload-artifact@v4
      with:
        name: generated
        path: generated/

  verify:
    name: Verify ${{ matrix.name }}
    needs: generate
    runs-on: ubuntu-latest
    strategy:
      # Every language runs to completion, so one failing does not hide another.
      fail-fast: false
      matrix:
        # Adding a language is an entry here plus release/<lang>/verify.sh and
        # release/<lang>/publish.sh. `lang` names paths and artifacts; `name` is
        # only what the job is called.
        include:
        - lang: go
          name: Go
        - lang: python
          name: Python
        - lang: typescript
          name: TypeScript
    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v4
      with:
        name: generated
        path: generated/

    - uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # The oldest Node the SDK supports (engines.node), so a newer-only API
    # cannot slip in unnoticed.
    - uses: actions/setup-node@v4
      with:
        node-version: '22.12'

    - name: Assemble, test and build
      env:
        DEPLOYER_TOKEN: ${{ secrets.GH_TOKEN }}
        VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: release/${{ matrix.lang }}/verify.sh

    - uses: actions/upload-artifact@v4
      with:
        name: sdk-${{ matrix.lang }}
        path: out/

  # The SDKs verify just tested, sharing one session file across processes: a
  # renewal in any language must leave the others authenticated.
  crosslang:
    name: Cross-language sessions
    needs: verify
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v4
      with:
        pattern: sdk-*
        path: out/

    - uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - uses: actions/setup-node@v4
      with:
        node-version: '22.12'

    - name: Run cross-language session tests
      run: release/crosslang/run.sh out/sdk-go/tree.tgz out/sdk-python/dist out/sdk-typescript

  publish:
    name: Publish
    if: github.ref_type == 'tag'
    # needs on the whole matrix: this job does not start unless every language
    # passed verify, and the languages passed together.
    needs: [verify, crosslang]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # PyPI and npm trusted publishing; no stored upload token
    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v4
      with:
        pattern: sdk-*
        path: out/

    # Order matters. A PyPI upload cannot be withdrawn and is the step most
    # likely to be refused (name, version already used, publisher config), so
    # it goes first; npm, equally irreversible, second; the Go push last. Every
    # step is a no-op when its registry already holds this release, so if any
    # step fails, re-running this job completes the release.
    - name: Publish jennah-sdk-py to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: out/sdk-python/dist/
        skip-existing: true

    # Trusted publishing needs npm 11.5.1 or later, which Node 22 does not ship.
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Publish jennah-sdk-ts to npm
      env:
        VERSION: ${{ github.ref_name }}
      run: release/typescript/publish.sh out/sdk-typescript

    - name: Publish jennah-sdk-go
      env:
        DEPLOYER_TOKEN: ${{ secrets.GH_TOKEN }}
        VERSION: ${{ github.ref_name }}
      run: release/go/publish.sh out/sdk-go
